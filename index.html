<style>

  --label-secondary: #86868b;
  --label-tertiary: #a1a1a6;
  --separator: rgba(60, 60, 67, 0.12);
  --apple-blue: #0071e3;
  --apple-blue-hover: #0077ed;
  --apple-gold: #ff9500;
  --apple-real-start: #ff9500;
  --apple-real-end: #ff3b30;
  --glass-bg: rgba(255, 255, 255, 0.82);
  --glass-border: rgba(255, 255, 255, 0.45);
  --sheet-shadow: 0 -8px 32px rgba(0, 0, 0, 0.08);
  --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
}

@media (prefers-color-scheme: dark) {
  :root {
    --system-bg: #000000;
    --card-bg: #1c1c1e;
    --secondary-card-bg: #2c2c2e;
    --label-primary: #f5f5f7;
    --label-secondary: #98989d;
    --label-tertiary: #636366;
    --separator: rgba(84, 84, 88, 0.36);
    --apple-blue: #0a84ff;
    --apple-blue-hover: #409cff;

* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  width: 100%;
  touch-action: manipulation;
}
#map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #e5e5ea;
  z-index: 1;
  touch-action: none;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Apple SD Gothic Neo", sans-serif;
  background: var(--system-bg);
  color: var(--label-primary);

  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.015em;
}

button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }

.glass {
  background: var(--glass-bg);
  -webkit-backdrop-filter: saturate(190%) blur(24px);

}

#top-container {

#top { display: flex; align-items: center; gap: 6px; width: 100%; }

  font-weight: 800;

}

}
.brand-btn .brand-point {

}

/* 외부 지도 바로가기 50:50 아이콘 바 */

}
.map-icon-btn {
  height: 46px;

  align-items: center;
  justify-content: center;
  border-radius: 14px;
  background: var(--secondary-card-bg);

}
.map-icon-btn:active {

.price-old {

.report-group {

#sheet {
  position: absolute; z-index: 8; left: 0; right: 0; bottom: 0; max-height: 86%; overflow-y: auto;

.btns { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
.btn {

</style>

function getDistanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371e3;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

const BAD_WORDS = ['시발', '씨발', '개새끼', '존나', '병신', '지랄', '새끼', '미친놈', '미친년', '좆', '창녀', '느금', '엠창', 'ㅅㅂ', 'ㅂㅅ', 'ㅈㄹ', 'tlqkf'];
function containsBadWords(text) {
  if (!text) return false;
  const clean = text.replace(/[\s\-_.,!?@#$%^&*()~`+=\/]/g, '').toLowerCase();
  return BAD_WORDS.some(w => clean.includes(w));
}

function resetScores(){ scores = { is_real: null, taste: 0, price: 0, kind: 0 }; selectedPhotoBlob = null; if (currentPreviewUrl) { URL.revokeObjectURL(currentPreviewUrl); currentPreviewUrl = null; } }

async function resizeImageFile(file, maxDimension = 1200, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDimension || h > maxDimension) {
          if (w > h) { h = Math.round((h * maxDimension) / w); w = maxDimension; }
          else { w = Math.round((w * maxDimension) / h); h = maxDimension; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('압축 실패')), 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function getRatingTier(avg){
  if (!avg || isNaN(avg)) return 'tier-none';
  const val = parseFloat(avg);
  if (val >= 4.5) return 'tier-gold';
  if (val >= 4.0) return 'tier-silver';
  if (val >= 3.5) return 'tier-bronze';
  if (val >= 3.0) return 'tier-titanium';
  if (val >= 2.0) return 'tier-neutral';
  return 'tier-muted';
}

async function load(){
  try {
    const [p, r, allRev] = await Promise.all([
      db.from('places').select('*'),
      db.from('place_ratings').select('*'),
      db.from('reviews').select('place_id, is_real')
    ]);
    rate = {}; (r.data || []).forEach(x => rate[x.place_id] = x);
    places = p.data || [];

    realStats = {};
    (allRev.data || []).forEach(rv => {
      if (!realStats[rv.place_id]) realStats[rv.place_id] = { total: 0, yes: 0 };
      if (rv.is_real !== null && rv.is_real !== undefined) {
        realStats[rv.place_id].total++;
        if (rv.is_real === true) realStats[rv.place_id].yes++;
      }
    });

    drawPins();
  } catch(e) { console.error(e); }
}

function drawPins(){
  if (!map || typeof naver === 'undefined' || !naver.maps) return;
  markers.forEach(m => m.setMap(null));
  markers = [];

  let listToDraw = places.filter(p => {
    const rt = rate[p.id];
    const avg = rt ? parseFloat(rt.avg_rating) : 0;
    const roundedStars = Math.round(avg);
    const price = Number(p.price || 0);

    if (filterRating !== 'all' && roundedStars !== parseInt(filterRating, 10)) return false;
    if (filterPrice !== 'all') {
      if (price <= 0) return false;
      if (filterPrice === 'under_6000' && price > 6000) return false;
      if (filterPrice === '6000_8000' && (price <= 6000 || price > 8000)) return false;
      if (filterPrice === '8000_10000' && (price <= 8000 || price > 10000)) return false;
      if (filterPrice === 'over_10000' && price <= 10000) return false;
    }

    return true;
  });

  const groups = {};
  listToDraw.forEach(p => {
    const key = `${parseFloat(p.lat).toFixed(5)},${parseFloat(p.lng).toFixed(5)}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  });

  Object.values(groups).forEach(list => {
    const first = list[0];
    const rt = rate[first.id];
    const avg = rt ? parseFloat(rt.avg_rating).toFixed(1) : null;
    const tierClass = getRatingTier(avg);

    const st = realStats[first.id];
    const isAuthentic = st && st.total >= 3 && ((st.yes / st.total) >= 0.9);
    const badgeHtml = isAuthentic ? `<span class="real-badge">🔥 찐</span> ` : '';

    if (list.length === 1) {
      const p = first;
      const rateBadge = avg ? `<span style="font-weight:700;font-size:12px;margin-left:2px;">(★${avg}/${rt?.n || 0})</span>` : `<span style="font-size:11px;opacity:0.8;margin-left:2px;">(신규)</span>`;
      const content = `<div class="pin ${tierClass}">${badgeHtml}<span style="font-weight:700">${esc(p.name)}</span> ${rateBadge}</div>`;

      const mk = new naver.maps.Marker({
        map, position: new naver.maps.LatLng(p.lat, p.lng),
        icon: { content, anchor: new naver.maps.Point(0, 0) }
      });
      naver.maps.Event.addListener(mk, 'click', () => openPlace(p));
      markers.push(mk);
    } else {
      const label = `${badgeHtml}${esc(first.name)} 외 ${list.length - 1}곳`;
      const mk = new naver.maps.Marker({
        map, position: new naver.maps.LatLng(first.lat, first.lng),
        icon: { content: `<div class="pin ${tierClass}">${label}</div>`, anchor: new naver.maps.Point(0, 0) }
      });
      naver.maps.Event.addListener(mk, 'click', () => openPlaceGroup(list));
      markers.push(mk);
    }
  });
}

function openPlaceGroup(list){
  const addr = list[0].address || '동일 건물 위치';
  sheet('<h2>' + esc(addr) + '</h2><p class="sub">등록된 가게가 ' + list.length + '개 있어요.</p>' +
    '<div style="margin-top:16px;border-radius:18px;overflow:hidden;background:var(--secondary-card-bg);border:0.5px solid var(--separator);">' +

    }).join('') + '</div>');

function openPopover(type, btnEl){
  if (openPopType === type) { closePopover(); return; }
  openPopType = type;
  const cfg = POP_MENUS[type]; if (!cfg) return;
  const curVal = cfg.getVal();
  popEl.innerHTML = cfg.items.map(it => `<button class="menu-item ${it.id === curVal ? 'selected' : ''}" data-item-id="${it.id}"><span>${esc(it.label)}</span>${it.id === curVal ? '<span class="check">✓</span>' : ''}</button>`).join('');
  const rect = btnEl.getBoundingClientRect();
  popEl.style.left = Math.max(12, Math.min(rect.left, window.innerWidth - 300)) + 'px';
  popEl.hidden = false;
}

        map.setCenter(new naver.maps.LatLng(myCoord.lat, myCoord.lng));

  } catch (e) { toast('지도 오류: ' + e.message); }

// ── 모바일 원핑거 줌 (더블탭 후 누른 채 드래그 시 확대/축소)
function initDoubleTapDragZoom() {
  const mapEl = $('map');
  if (!mapEl) return;

  let lastTouchEndTime = 0;
  let isDoubleTapDragging = false;
  let startY = 0;
  let initialZoom = 15;

  mapEl.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) {
      isDoubleTapDragging = false;
      return;
    }
    const now = Date.now();
    const touch = e.touches[0];
    const timeSinceLastTouch = now - lastTouchEndTime;

    // 더블탭 감지 (40ms ~ 320ms 사이 연속 터치)
    if (timeSinceLastTouch > 40 && timeSinceLastTouch < 320) {
      isDoubleTapDragging = true;
      startY = touch.clientY;
      if (map) initialZoom = map.getZoom();
      e.preventDefault();
    }
  }, { passive: false });

  mapEl.addEventListener('touchmove', (e) => {
    if (!isDoubleTapDragging || !map || e.touches.length !== 1) return;
    e.preventDefault();
    const currentY = e.touches[0].clientY;
    const dy = currentY - startY; // 아래로 내리면 양수(확대), 위로 올리면 음수(축소)

    // 약 45px 이동당 1단계 줌 변경
    const zoomDelta = Math.floor(dy / 45);
    const targetZoom = Math.min(21, Math.max(6, initialZoom + zoomDelta));
    if (map.getZoom() !== targetZoom) {
      map.setZoom(targetZoom, false);
    }
  }, { passive: false });

  const endDrag = () => {
    if (isDoubleTapDragging) {
      isDoubleTapDragging = false;
    }
    lastTouchEndTime = Date.now();
  };

  mapEl.addEventListener('touchend', endDrag);
  mapEl.addEventListener('touchcancel', endDrag);
}

      nearbyMarkers = [];
      return;
    }
    const bounds = map.getBounds();
    if (!bounds) return;
    const sw = bounds.getSW(), ne = bounds.getNE();
    if (!sw || !ne) return;

    const { data } = await db.from('biz_master')
      .select('*')
      .gte('lat', sw.lat()).lte('lat', ne.lat())
      .gte('lng', sw.lng()).lte('lng', ne.lng())
      .limit(25);

    if (mySeq !== nearbySeq) return;
    if (!data) return;

    const registeredBizIds = new Set(places.map(p => p.biz_id));
    const unregistered = data.filter(b => !registeredBizIds.has(b.id));
    nearbyMarkers.forEach(m => m.setMap(null));
    nearbyMarkers = [];

    unregistered.forEach(b => {
      biz[b.id] = b;
      const mk = new naver.maps.Marker({
        map, position: new naver.maps.LatLng(b.lat, b.lng),
        icon: { content: '<div class="pin biz">+ ' + esc(b.name) + '</div>', anchor: new naver.maps.Point(0, 0) }
      });
      naver.maps.Event.addListener(mk, 'click', () => openNew(b));
      nearbyMarkers.push(mk);
    });
  } catch (err) {
    console.warn('주변 매장 조회 예외 방어:', err);
  }
}

$('q').oninput = e => { clearTimeout(st); st = setTimeout(() => search(e.target.value.trim()), 250); };
let st;
async function search(q){
  const box = $('res'); if (!q){ box.hidden = true; return; }
  const mySeq = ++searchSeq;
  const local = places.filter(p => p.name.includes(q)).slice(0, 10);
  const { data } = await db.from('biz_master').select('*').ilike('name', '%' + q.replace(/[%_]/g, '') + '%').limit(20);
  if (mySeq !== searchSeq) return;
  const reg = new Set(places.map(p => p.biz_id));
  const rows = (data || []).filter(b => !reg.has(b.id));
  biz = Object.fromEntries(rows.map(b => [b.id, b]));

  let h = local.map(p => '<button class="row" data-a="place" data-id="' + esc(p.id) + '"><b>' + esc(p.name) + '</b><small>' + esc(p.address) + '</small><i>' + won(p.price) + '원</i></button>').join('');
  h += rows.map(b => '<button class="row" data-a="pick" data-id="' + esc(b.id) + '"><b>' + esc(b.name) + '</b><small>' + esc(b.road_addr || b.lot_addr) + ' · 등록 가능</small></button>').join('');
  box.innerHTML = h; box.hidden = false;
}

load();
const s = document.createElement('script');
s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(CLIENT_ID) + '&ncpClientId=' + encodeURIComponent(CLIENT_ID);
s.onload = initMap;
document.head.appendChild(s);
</script>
