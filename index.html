<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MYGJJ</title>
<style>
:root {
  --system-bg: #f2f2f7;
  --card-bg: #ffffff;
  --secondary-card-bg: #f8f8fa;
  --label-primary: #1d1d1f;
  --label-secondary: #86868b;
  --label-tertiary: #a1a1a6;
  --separator: rgba(60, 60, 67, 0.12);
  --apple-blue: #0071e3;
  --apple-blue-hover: #0077ed;
  --apple-gold: #ff9500;
  --glass-bg: rgba(255, 255, 255, 0.82);
  --glass-border: rgba(255, 255, 255, 0.45);
  --sheet-shadow: 0 -8px 32px rgba(0, 0, 0, 0.08);
  --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
}

@media (prefers-color-scheme: dark) {
  :root {
    --system-bg: #000000;
    --card-bg: #1c1c1e;
    --secondary-card-bg: #2c2c2e;
    --label-primary: #f5f5f7;
    --label-secondary: #98989d;
    --label-tertiary: #636366;
    --separator: rgba(84, 84, 88, 0.36);
    --apple-blue: #0a84ff;
    --apple-blue-hover: #409cff;
    --apple-gold: #ff9f0a;
    --glass-bg: rgba(28, 28, 30, 0.82);
    --glass-border: rgba(255, 255, 255, 0.1);
    --sheet-shadow: 0 -8px 32px rgba(0, 0, 0, 0.4);
    --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }
}

* {
  box-sizing: border-box;
  margin: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  width: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Apple SD Gothic Neo", sans-serif;
  background: var(--system-bg);
  color: var(--label-primary);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.015em;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

#map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #e5e5ea;
  z-index: 1;
}

.glass {
  background: var(--glass-bg);
  -webkit-backdrop-filter: saturate(190%) blur(24px);
  backdrop-filter: saturate(190%) blur(24px);
  border: 0.5px solid var(--glass-border);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
}

/* Header & Top Bar */
#top-container {
  position: absolute;
  z-index: 5;
  left: 16px;
  right: 16px;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#top {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
}

#q {
  flex: 1;
  min-width: 0;
  height: 48px;
  line-height: 48px;
  border-radius: 16px;
  padding: 0 18px;
  font-size: 16px;
  font-weight: 400;
  color: var(--label-primary);
  border: 0.5px solid var(--glass-border);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  margin: 0;
}

#q::placeholder {
  color: var(--label-secondary);
}

#q:focus {
  outline: none;
  box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.3);
}

#me {
  height: 48px;
  line-height: 48px;
  padding: 0 18px;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 600;
  color: var(--apple-blue);
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
}

#me:active {
  transform: scale(0.97);
}

/* 3. 정렬 탭바 (Filter / Sort Pills) */
#sort-bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px 2px;
  scrollbar-width: none;
}
#sort-bar::-webkit-scrollbar {
  display: none;
}

.sort-pill {
  flex-shrink: 0;
  height: 34px;
  padding: 0 13px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  color: var(--label-secondary);
  background: var(--glass-bg);
  border: 0.5px solid var(--glass-border);
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all 0.18s ease;
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
}

.sort-pill:active {
  transform: scale(0.95);
}

.sort-pill.active {
  background: var(--label-primary);
  color: var(--system-bg);
  border-color: var(--label-primary);
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.16);
}

/* 드롭다운 팝오버 메뉴 */
.filter-popover {
  position: absolute;
  z-index: 7;
  top: calc(env(safe-area-inset-top, 0px) + 104px);
  max-width: 290px;
  border-radius: 20px;
  padding: 6px;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
  display: flex;
  flex-direction: column;
  gap: 2px;
  border: 0.5px solid var(--glass-border);
  animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes popIn {
  from { opacity: 0; transform: translateY(-8px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.filter-popover[hidden] {
  display: none;
}
.menu-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 14px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 500;
  color: var(--label-primary);
  text-align: left;
  transition: background 0.12s ease;
}
.menu-item:active {
  background: rgba(0, 0, 0, 0.05);
}
.menu-item.selected {
  font-weight: 700;
  color: var(--apple-blue);
  background: rgba(0, 113, 227, 0.09);
}
.menu-item .check {
  font-size: 15px;
  font-weight: 700;
  color: var(--apple-blue);
}

.sort-pill.filtered {
  background: var(--apple-blue);
  color: #fff;
  border-color: var(--apple-blue);
  box-shadow: 0 3px 12px rgba(0, 113, 227, 0.3);
}

/* Search Dropdown Results */
#res {
  position: absolute;
  z-index: 6;
  left: 16px;
  right: 16px;
  top: calc(env(safe-area-inset-top, 0px) + 112px);
  max-width: 560px;
  margin: 0 auto;
  max-height: 52%;
  overflow-y: auto;
  border-radius: 18px;
}

#res[hidden] {
  display: none;
}

.row {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  border-bottom: 0.5px solid var(--separator);
  position: relative;
  transition: background 0.15s ease;
}

.row:last-child {
  border-bottom: none;
}

.row:active {
  background: rgba(0, 0, 0, 0.04);
}

.row b {
  display: block;
  font-size: 16px;
  font-weight: 600;
  color: var(--label-primary);
  line-height: 1.3;
}

.row small {
  display: block;
  color: var(--label-secondary);
  font-size: 13px;
  margin-top: 3px;
}

.row i {
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  font-style: normal;
  font-weight: 600;
  font-size: 15px;
  color: var(--apple-blue);
}

.ask {
  color: var(--apple-blue);
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  padding: 15px;
}

.empty {
  padding: 20px 18px;
  text-align: center;
  color: var(--label-secondary);
  font-size: 15px;
}

/* 1 & 2. 세련된 애플 메탈릭 마커 핀 (0.5 단위 티어별 배경색) */
.pin {
  transform: translate(-50%, -100%);
  padding: 6px 12px;
  border-radius: 999px;
  white-space: nowrap;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  border: 0.5px solid rgba(0, 0, 0, 0.12);
  transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.15s ease;
}

.pin:active {
  transform: translate(-50%, -100%) scale(0.95);
}

.pin .p-name {
  color: inherit;
  font-weight: 700;
}

.pin .p-rate {
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 2px;
}

.pin .p-cnt {
  font-size: 11px;
  font-weight: 500;
  opacity: 0.8;
}

/* 금 (Gold Tier: 4.5 ~ 5.0) */
.pin.tier-gold {
  background: linear-gradient(135deg, #fff2cc 0%, #ffd666 100%);
  color: #5c3b00;
  border-color: rgba(212, 160, 23, 0.5);
  box-shadow: 0 4px 18px rgba(212, 160, 23, 0.35);
}
@media (prefers-color-scheme: dark) {
  .pin.tier-gold {
    background: linear-gradient(135deg, #664600 0%, #3d2900 100%);
    color: #ffd666;
    border-color: #d4a017;
  }
}

/* 은 (Silver Tier: 4.0 ~ 4.4) */
.pin.tier-silver {
  background: linear-gradient(135deg, #f5f5f7 0%, #dcdce2 100%);
  color: #2c2c2e;
  border-color: rgba(142, 142, 147, 0.45);
  box-shadow: 0 4px 16px rgba(142, 142, 147, 0.3);
}
@media (prefers-color-scheme: dark) {
  .pin.tier-silver {
    background: linear-gradient(135deg, #3a3a3c 0%, #242426 100%);
    color: #e5e5ea;
    border-color: #636366;
  }
}

/* 동 (Bronze Tier: 3.5 ~ 3.9) */
.pin.tier-bronze {
  background: linear-gradient(135deg, #faebd7 0%, #e2b18a 100%);
  color: #4a2810;
  border-color: rgba(184, 115, 51, 0.45);
  box-shadow: 0 4px 16px rgba(184, 115, 51, 0.28);
}
@media (prefers-color-scheme: dark) {
  .pin.tier-bronze {
    background: linear-gradient(135deg, #4d2d17 0%, #2e1a0d 100%);
    color: #f7cdb0;
    border-color: #8c532b;
  }
}

/* 3.0 ~ 3.4 (티타늄 / 웜그레이) */
.pin.tier-titanium {
  background: #ececf0;
  color: #38383a;
  border-color: #c7c7cc;
}
@media (prefers-color-scheme: dark) {
  .pin.tier-titanium {
    background: #2c2c2e;
    color: #c7c7cc;
    border-color: #48484a;
  }
}

/* 2.0 ~ 2.9 (소프트 뉴트럴) */
.pin.tier-neutral {
  background: #f2f2f7;
  color: #636366;
  border-color: #d1d1d6;
}
@media (prefers-color-scheme: dark) {
  .pin.tier-neutral {
    background: #1c1c1e;
    color: #8e8e93;
    border-color: #38383a;
  }
}

/* 0.5 ~ 1.9 (뮤트) */
.pin.tier-muted {
  background: #e5e5ea;
  color: #8e8e93;
  border-color: #d1d1d6;
}

/* 평가 없음 (신규 등록 매장) */
.pin.tier-none {
  background: var(--card-bg);
  color: var(--label-primary);
  border-color: var(--separator);
}

/* 미등록 주변 매장 핀 */
.pin.biz {
  background: var(--card-bg);
  color: var(--label-secondary);
  font-weight: 500;
  font-size: 12px;
  border: 1px dashed var(--separator);
  padding: 5px 10px;
}

.pin.biz.multi {
  background: var(--secondary-card-bg);
  color: var(--apple-blue);
  font-weight: 600;
  border: 1px solid var(--apple-blue);
  box-shadow: 0 4px 14px rgba(0, 113, 227, 0.2);
}

/* 4. 버전 뱃지 위치: 좌측 하단 */
#ver-badge {
  position: absolute;
  z-index: 6;
  left: 14px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  font-size: 11px;
  font-weight: 600;
  color: var(--label-secondary);
  background: var(--glass-bg);
  padding: 4px 9px;
  border-radius: 10px;
  pointer-events: none;
  border: 0.5px solid var(--glass-border);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}

/* iOS Bottom Sheet (Modal Panel) */
#sheet {
  position: absolute;
  z-index: 8;
  left: 0;
  right: 0;
  bottom: 0;
  max-height: 86%;
  overflow-y: auto;
  background: var(--card-bg);
  border-radius: 28px 28px 0 0;
  padding: 24px 22px calc(env(safe-area-inset-bottom, 0px) + 24px);
  box-shadow: var(--sheet-shadow);
  transform: translateY(105%);
  transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
}

#sheet.open {
  transform: translateY(0);
}

#sheet::before {
  content: "";
  display: block;
  width: 38px;
  height: 5px;
  background: var(--separator);
  border-radius: 999px;
  margin: -8px auto 16px;
}

.x {
  position: absolute;
  right: 16px;
  top: 18px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--secondary-card-bg);
  color: var(--label-secondary);
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease;
}

.x:active {
  transform: scale(0.92);
}

h2 {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.025em;
  padding-right: 36px;
  color: var(--label-primary);
  line-height: 1.25;
}

h3 {
  font-size: 15px;
  font-weight: 600;
  margin: 20px 0 8px;
  color: var(--label-secondary);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.sub {
  color: var(--label-secondary);
  font-size: 14px;
  margin-top: 5px;
  line-height: 1.4;
}

.stats {
  display: flex;
  gap: 10px;
  margin: 18px 0;
}

.stats div {
  flex: 1;
  background: var(--secondary-card-bg);
  border-radius: 18px;
  padding: 14px 16px;
  border: 0.5px solid var(--separator);
}

.stats small {
  display: block;
  color: var(--label-secondary);
  font-size: 12px;
  font-weight: 500;
  margin-bottom: 2px;
}

.stats b {
  font-size: 22px;
  font-weight: 700;
  color: var(--label-primary);
  letter-spacing: -0.02em;
}

.stats span {
  font-size: 13px;
  color: var(--label-secondary);
  font-weight: 400;
}

.btns {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 14px;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: var(--label-primary);
  background: var(--secondary-card-bg);
  border-radius: 16px;
  padding: 15px;
  font-size: 16px;
  font-weight: 600;
  width: 100%;
  border: 0.5px solid var(--separator);
  transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
}

.btn:active {
  transform: scale(0.98);
}

.btn.primary {
  background: var(--apple-blue);
  color: #ffffff;
  border: none;
  box-shadow: 0 4px 14px rgba(0, 113, 227, 0.28);
}

.btn.primary:active {
  background: var(--apple-blue-hover);
}

input, select {
  width: 100%;
  height: 50px;
  border: 0.5px solid var(--separator);
  border-radius: 16px;
  padding: 0 16px;
  font-size: 16px;
  background: var(--secondary-card-bg);
  color: var(--label-primary);
  margin-top: 8px;
  font-family: inherit;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--apple-blue);
  box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.2);
}

input::placeholder {
  color: var(--label-tertiary);
}

/* 갤럭시/모바일 튀어나옴 방지 최적화 그리드 */
.rating-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  background: var(--secondary-card-bg);
  padding: 10px;
  border-radius: 20px;
  margin-top: 12px;
  border: 0.5px solid var(--separator);
  box-sizing: border-box;
}

.rating-item {
  background: var(--card-bg);
  padding: 10px 10px;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  box-shadow: var(--card-shadow);
  min-width: 0;
  box-sizing: border-box;
}

.rating-item.full {
  grid-column: span 2;
  background: rgba(255, 149, 0, 0.07);
  border: 0.5px solid rgba(255, 149, 0, 0.28);
  box-shadow: none;
  padding: 12px 14px;
}

.rating-item label {
  font-size: 13px;
  font-weight: 600;
  color: var(--label-secondary);
  white-space: nowrap;
}

.rating-item.full label {
  color: var(--label-primary);
  font-size: 14px;
}

.star-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  gap: 0;
}

.star-btn {
  border: 0;
  background: none;
  font-size: 19px;
  color: var(--separator);
  padding: 2px 0;
  line-height: 1;
  flex: 1;
  text-align: center;
  transition: transform 0.1s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.star-btn:active {
  transform: scale(1.2);
}

.star-btn.on {
  color: var(--apple-gold);
}

.total-score {
  margin-left: auto;
  font-size: 17px;
  font-weight: 700;
  color: var(--apple-gold);
}

.rv {
  padding: 12px 0;
  border-top: 0.5px solid var(--separator);
  font-size: 15px;
  line-height: 1.45;
}

.u {
  border: 0;
  background: none;
  color: var(--apple-blue);
  font-weight: 600;
  padding: 0;
  margin-right: 6px;
}

/* 사진 업로더 & 리뷰 사진 스타일 (Apple HIG) */
.photo-uploader {
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.photo-upload-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 48px;
  background: var(--secondary-card-bg);
  border: 1px dashed var(--separator);
  border-radius: 14px;
  color: var(--apple-blue);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.photo-upload-btn:active {
  background: rgba(0, 113, 227, 0.08);
  transform: scale(0.98);
}
.photo-preview-box {
  position: relative;
  width: 100%;
  height: 180px;
  border-radius: 14px;
  overflow: hidden;
  background: var(--secondary-card-bg);
  border: 0.5px solid var(--separator);
}
.photo-preview-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.photo-remove-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.65);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  backdrop-filter: blur(8px);
}
.rv-photo-wrap {
  margin-top: 8px;
  width: 100%;
  max-height: 220px;
  border-radius: 12px;
  overflow: hidden;
  border: 0.5px solid var(--separator);
  background: var(--secondary-card-bg);
}
.rv-photo {
  width: 100%;
  max-height: 220px;
  object-fit: cover;
  display: block;
  cursor: pointer;
  transition: transform 0.2s ease;
}
.rv-photo:active {
  transform: scale(0.98);
}

#toast {
  position: absolute;
  z-index: 99;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 72px);
  transform: translateX(-50%);
  background: var(--card-bg);
  color: var(--label-primary);
  padding: 12px 20px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  max-width: 90%;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
  border: 0.5px solid var(--separator);
}

#toast[hidden] {
  display: none;
}

@media (min-width: 760px) {
  #sheet {
    left: 20px;
    right: auto;
    bottom: 20px;
    width: 420px;
    max-height: calc(100% - 40px);
    border-radius: 28px;
  }
}
</style>
</head>
<body>
<div id="map"></div>
<div id="ver-badge">v0.018</div>

<div id="top-container">
  <div id="top">
    <input id="q" class="glass" type="search" placeholder="가게 이름 검색" autocomplete="off" aria-label="가게 이름 검색">
    <button id="me" class="glass" data-a="me">로그인</button>
  </div>

// 두 좌표 간 거리 계산 (단위: 미터)
function getDistanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371e3;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLng / 2) * Math.sin(dLng / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

// ── 클라이언트 브라우저 1200px 고화질 자동 리사이징 & 압축 (JPEG 품질 0.82)
async function resizeImageFile(file, maxDimension = 1200, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let width = img.width;
        let height = img.height;

        if (width > maxDimension || height > maxDimension) {
          if (width > height) {
            height = Math.round((height * maxDimension) / width);
            width = maxDimension;
          } else {
            width = Math.round((width * maxDimension) / height);
            height = maxDimension;
          }
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        canvas.toBlob(blob => {
          if (blob) resolve(blob);
          else reject(new Error('Canvas toBlob 변환 실패'));
        }, 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function getRatingTier(avg){
  if (!avg || isNaN(avg)) return 'tier-none';
  const val = parseFloat(avg);
  if (val >= 4.5) return 'tier-gold';       // 금 (4.5 ~ 5.0)
  if (val >= 4.0) return 'tier-silver';     // 은 (4.0 ~ 4.4)
  if (val >= 3.5) return 'tier-bronze';     // 동 (3.5 ~ 3.9)
  if (val >= 3.0) return 'tier-titanium';   // 티타늄 (3.0 ~ 3.4)
  if (val >= 2.0) return 'tier-neutral';    // 뉴트럴 (2.0 ~ 2.9)
  return 'tier-muted';                      // 뮤트 (0.5 ~ 1.9)
}

function drawPins(){
  if (!map || typeof naver === 'undefined' || !naver.maps) return;
  markers.forEach(m => m.setMap(null));
  markers = [];

  // 반경 300m 원 시각화 제어
  if (radiusCircle) {
    radiusCircle.setMap(null);
    radiusCircle = null;
  }
  if (filterRadius300 && map) {
    const centerPoint = myCoord ? new naver.maps.LatLng(myCoord.lat, myCoord.lng) : map.getCenter();
    radiusCircle = new naver.maps.Circle({
      map: map,
      center: centerPoint,
      radius: 300,
      fillColor: '#0071e3',
      fillOpacity: 0.1,
      strokeColor: '#0071e3',
      strokeOpacity: 0.5,
      strokeWeight: 1.5,
      strokeLineCap: 'round'
    });
  }

  // 별점(1,2,3,4,5개), 가격대, 반경 300m 필터 적용
  let listToDraw = places.filter(p => {
    const rt = rate[p.id];
    const avg = rt ? parseFloat(rt.avg_rating) : 0;
    const roundedStars = Math.round(avg);
    const price = Number(p.price || 0);

    // 1. 별점 필터 (선택한 별 개수 매장만 정확히 표시)
    if (filterRating !== 'all') {
      const targetStar = parseInt(filterRating, 10);
      if (roundedStars !== targetStar) return false;
    }

    // 2. 가격대 필터
    if (filterPrice === 'under_6000' && price > 6000) return false;
    if (filterPrice === '7000_8000' && (price < 7000 || price > 8000)) return false;
    if (filterPrice === '8500_10000' && (price < 8500 || price > 10000)) return false;
    if (filterPrice === 'over_10000' && price <= 10000) return false;

    // 3. 반경 300m 필터
    if (filterRadius300) {
      const refLat = myCoord ? myCoord.lat : map.getCenter().lat();
      const refLng = myCoord ? myCoord.lng : map.getCenter().lng();
      const dist = getDistanceMeters(refLat, refLng, parseFloat(p.lat), parseFloat(p.lng));
      if (dist > 300) return false;
    }

    return true;
  });

  // 정렬 적용 (리뷰 많은 순 및 평점 높은 순 제거 -> 가격순/기본순)
  if (currentSort === 'price_asc') {
    listToDraw.sort((a, b) => ((a.price || 0) - (b.price || 0)));
  } else if (currentSort === 'price_desc') {
    listToDraw.sort((a, b) => ((b.price || 0) - (a.price || 0)));
  }

  const groups = {};
  listToDraw.forEach(p => {
    const key = `${parseFloat(p.lat).toFixed(5)},${parseFloat(p.lng).toFixed(5)}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  });

  Object.values(groups).forEach(list => {
    if (list.length === 1) {
      const p = list[0];
      const rt = rate[p.id];
      const avg = rt ? parseFloat(rt.avg_rating).toFixed(1) : null;
      const tierClass = getRatingTier(avg);
      const cntStr = rt && rt.n ? `(${rt.n})` : '';
      const rateBadge = avg ? `<span class="p-rate">★${avg}</span><span class="p-cnt">${cntStr}</span>` : `<span class="p-cnt">신규</span>`;

      const content = `
        <div class="pin ${tierClass}">
          <span class="p-name">${esc(p.name)}</span>
          ${rateBadge}
        </div>
      `;

      const mk = new naver.maps.Marker({
        map,
        position: new naver.maps.LatLng(p.lat, p.lng),
        icon: { content, anchor: new naver.maps.Point(0, 0) }
      });
      naver.maps.Event.addListener(mk, 'click', () => openPlace(p));
      markers.push(mk);
    } else {
      const first = list[0];
      const rt = rate[first.id];
      const avg = rt ? parseFloat(rt.avg_rating).toFixed(1) : null;
      const tierClass = getRatingTier(avg);
      const label = `${esc(first.name)} 외 ${list.length - 1}곳`;

      const mk = new naver.maps.Marker({
        map,
        position: new naver.maps.LatLng(first.lat, first.lng),
        icon: { content: `<div class="pin ${tierClass} multi">${label}</div>`, anchor: new naver.maps.Point(0, 0) }
      });
      naver.maps.Event.addListener(mk, 'click', () => openPlaceGroup(list));
      markers.push(mk);
    }
  });
}

function updatePillLabels(){
  const pr = $('pill-rating');

  if (currentSort === 'default') {

  if (filterRating !== 'all' || filterPrice !== 'all' || filterRadius300 || currentSort !== 'default') {

  if (openPopType === type) {

      <span>${esc(item.label)}</span>
      ${isSel ? '<span class="check">✓</span>' : ''}

  }).join('');

  // 팝오버 위치 계산
  const rect = btnEl.getBoundingClientRect();
  popEl.style.left = Math.max(12, Math.min(rect.left, window.innerWidth - 300)) + 'px';

    if (zoom < 14){
      nearbyMarkers.forEach(m => m.setMap(null));
      nearbyMarkers = [];
      return;

    const { data, error } = await db.from('biz_master')
      .select('*')
      .gte('lat', sw.lat()).lte('lat', ne.lat())
      .gte('lng', sw.lng()).lte('lng', ne.lng())
      .limit(60);

    if (error || !data) return;
    const registeredBizIds = new Set(places.map(p => p.biz_id));

        <div style="display:flex;align-items:center;">
          <label>5. 종합</label>
          <span class="total-score" id="total-score">- / 5.0</span>
        </div>
      </div>
    </div>
    <input id="c" placeholder="한줄평 남기기 (선택)" maxlength="100">
    <!-- 간짜장 사진 첨부 및 1200px 압축 미리보기 -->
    <div class="photo-uploader">
      <label for="review-photo-input" class="photo-upload-btn" id="photo-upload-label">
        <span>📷</span>
        <span id="photo-upload-text">간짜장 사진 첨부 (선택)</span>
      </label>
      <input id="review-photo-input" type="file" accept="image/*" style="display:none;" onchange="handlePhotoSelect(event)">
      <div id="photo-preview-box" class="photo-preview-box" style="display:none;">
        <img id="photo-preview-img" src="" alt="사진 미리보기">
        <button type="button" class="photo-remove-btn" onclick="removeSelectedPhoto()">✕</button>
      </div>
    </div>
  `;
}

async function handlePhotoSelect(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  toast('사진 최적화 중 (1200px)...');
  try {
    const resizedBlob = await resizeImageFile(file, 1200, 0.82);
    selectedPhotoBlob = resizedBlob;
    const previewUrl = URL.createObjectURL(resizedBlob);
    const box = $('photo-preview-box');
    const img = $('photo-preview-img');
    const label = $('photo-upload-label');
    if (box && img) {
      img.src = previewUrl;
      box.style.display = 'block';
    }
    if (label) label.style.display = 'none';
    const kb = Math.round(resizedBlob.size / 1024);
    toast(`사진 준비 완료 (${kb}KB)`);
  } catch(err) {
    console.error(err);
    toast('사진 처리 실패: ' + err.message);
  }
}

function removeSelectedPhoto() {
  selectedPhotoBlob = null;
  const input = $('review-photo-input');
  if (input) input.value = '';
  const box = $('photo-preview-box');
  const label = $('photo-upload-label');
  if (box) box.style.display = 'none';
  if (label) label.style.display = 'flex';
}

function updateStarsUI(){
  document.querySelectorAll('.star-btn').forEach(btn => {
    const cat = btn.dataset.cat;
    const n = +btn.dataset.n;
    btn.classList.toggle('on', n <= (scores[cat] || 0));
  });
  const allFilled = scores.taste > 0 && scores.price > 0 && scores.kind > 0 && scores.clean > 0;
  const el = $('total-score');
  if (el) {
    if (allFilled) {
      const avg = ((scores.taste + scores.price + scores.kind + scores.clean) / 4).toFixed(1);
      el.textContent = `★ ${avg} / 5.0`;
    } else {
      el.textContent = '- / 5.0';
    }
  }
}

$('q').oninput = e => { clearTimeout(st); st = setTimeout(() => search(e.target.value.trim()), 250); };
let st;
async function search(q){
  const box = $('res');
  if (!q){ box.hidden = true; return; }
  const local = places.filter(p => p.name.includes(q)).slice(0, 10);
  const { data, error } = await db.from('biz_master').select('*').ilike('name', '%' + q.replace(/[%_]/g, '') + '%').limit(20);
  const reg = new Set(places.map(p => p.biz_id));
  const rows = (data || []).filter(b => !reg.has(b.id));
  biz = Object.fromEntries(rows.map(b => [b.id, b]));
  let h = local.map(p => '<button class="row" data-a="place" data-id="' + esc(p.id) + '"><b>' + esc(p.name) + '</b><small>' + esc(p.address) + '</small><i>' + won(p.price) + '원</i></button>').join('');
  h += rows.map(b => '<button class="row" data-a="pick" data-id="' + esc(b.id) + '"><b>' + esc(b.name) + (b.branch ? ' ' + esc(b.branch) : '') + '</b><small>' + esc(b.road_addr || b.lot_addr) + ' · 등록 가능</small></button>').join('');
  if (error) h += '<div class="empty">검색 오류: ' + esc(error.message) + '</div>';
  else if (!local.length && !rows.length) h += '<div class="empty">“' + esc(q) + '” 검색 결과가 없어요</div>';
  h += '<button class="row ask" data-a="ask" data-q="' + esc(q) + '">찾는 가게가 없나요? 등록 요청하기</button>';
  box.innerHTML = h; box.hidden = false;
}

async function openPlace(p){
  cur = p; const rt = rate[p.id], addr = p.address || '';
  let fav = null; if (me) fav = (await db.from('favorites').select('place_id').eq('place_id', p.id).maybeSingle()).data;
  const rv = (await db.from('reviews').select('rating,comment,user_id,photo_url,profiles(username)').eq('place_id', p.id).order('created_at', { ascending: false }).limit(15)).data || [];
  sheet('<h2>' + esc(p.name) + '</h2><p class="sub">' + esc(addr) + '</p>' +
    '<div class="stats"><div><small>간짜장 금액</small><b>' + won(p.price) + '원</b></div><div><small>평점</small><b>' + (rt ? rt.avg_rating + ' <span>/ 5 (' + rt.n + ')</span>' : '-') + '</b></div></div>' +
    '<div class="btns"><a class="btn" target="_blank" rel="noopener" href="https://map.naver.com/p/search/' + encodeURIComponent(p.name + ' ' + addr) + '">네이버 지도에서 보기</a>' +
    '<a class="btn" target="_blank" rel="noopener" href="https://map.kakao.com/link/map/' + encodeURIComponent(p.name) + ',' + p.lat + ',' + p.lng + '">카카오맵에서 보기</a>' +
    '<button class="btn" data-a="fav">' + (fav ? '♥ 즐겨찾기 해제' : '♡ 즐겨찾기') + '</button></div>' +
    '<h3>평가 남기기</h3>' + renderRatingComponent() + '<button class="btn primary" style="margin-top:14px" data-a="review">등록</button>' +
    '<h3>리뷰</h3>' + (rv.length ? rv.map(r => '<div class="rv"><button class="u" data-a="user" data-id="' + esc(r.user_id) + '">@' + esc(r.profiles?.username || '익명') + '</button>' + '★'.repeat(r.rating) + (r.comment ? '<br>' + esc(r.comment) : '') + (r.photo_url ? '<div class="rv-photo-wrap"><img src="' + esc(r.photo_url) + '" class="rv-photo" alt="리뷰 사진" onclick="window.open(\'' + esc(r.photo_url) + '\')"></div>' : '') + '</div>').join('') : '<p class="sub">아직 리뷰가 없어요</p>'));
  if (map) map.panTo(new naver.maps.LatLng(p.lat, p.lng));
}

function openNew(b){
  curBiz = b;
  sheet('<h2>' + esc(b.name) + (b.branch ? ' ' + esc(b.branch) : '') + '</h2><p class="sub">' + esc(b.road_addr || b.lot_addr) + '</p>' +
    '<input id="pr" type="number" step="100" inputmode="numeric" placeholder="간짜장 금액 입력 (원)">' +
    renderRatingComponent() + 
    '<button class="btn primary" style="margin-top:16px" data-a="saveNew">가게 등록하기</button>');
}

function openAsk(q){
  sheet('<h2>등록 요청</h2><p class="sub">찾는 가게가 없으면 알려주세요. 확인 후 추가할게요.</p><input id="an" value="' + esc(q) + '" placeholder="가게 이름"><input id="aa" placeholder="주소 또는 위치"><input id="ao" placeholder="메모 (선택)"><button class="btn primary" style="margin-top:16px" data-a="sendAsk">요청 보내기</button>');
}

function openLogin(){
  sheet('<h2>로그인</h2><p class="sub">평점, 즐겨찾기, 팔로우를 쓰려면 로그인하세요.</p><div class="btns" style="margin-top:18px"><button class="btn primary" data-a="login" data-p="google">Google로 계속하기</button><button class="btn" data-a="login" data-p="kakao">카카오로 계속하기</button></div>');
}

async function openUser(uid){
  const { data: s } = await db.from('profile_stats').select('*').eq('id', uid).maybeSingle();
  if (!s){ toast('유저를 찾을 수 없어요'); return; }
  let fl = null; if (me && me.id !== uid) fl = (await db.from('follows').select('followee_id').eq('follower_id', me.id).eq('followee_id', uid).maybeSingle()).data;
  sheet('<h2>@' + esc(s.username) + '</h2><div class="stats"><div><small>게시물</small><b>' + s.post_count + '</b></div><div><small>평균 평점</small><b>' + (s.avg_rating ?? '-') + '</b></div></div>' +
    (me && me.id !== uid ? '<button class="btn primary" data-a="follow" data-id="' + esc(uid) + '" data-on="' + (fl ? 1 : 0) + '">' + (fl ? '팔로잉' : '팔로우') + '</button>' : '') +
    (me && me.id === uid ? '<button class="btn" data-a="logout">로그아웃</button>' : ''));
}

const A = {
  close: () => closeSheet(),
  me: () => me ? openUser(me.id) : openLogin(),
  place: d => { const p = places.find(x => x.id === d.id); if (p) openPlace(p); },
  pick: d => openNew(biz[d.id]),
  ask: d => openAsk(d.q),
  score: d => {
    scores[d.cat] = +d.n;
    updateStarsUI();
  },
  login: d => db.auth.signInWithOAuth({ provider: d.p, options: { redirectTo: location.origin + location.pathname } }).then(r => r.error && toast('로그인 설정 필요: ' + r.error.message)),
  logout: async () => { await db.auth.signOut(); closeSheet(); },
  user: d => openUser(d.id),
  fav: async () => {
    if (needLogin()) return;
    const { data } = await db.from('favorites').select('place_id').eq('place_id', cur.id).maybeSingle();
    if (data) await db.from('favorites').delete().eq('place_id', cur.id); else await db.from('favorites').insert({ place_id: cur.id });
    openPlace(cur);
  },
  follow: async d => {
    if (needLogin()) return;
    if (d.on === '1') await db.from('follows').delete().eq('follower_id', me.id).eq('followee_id', d.id);
    else await db.from('follows').insert({ followee_id: d.id });
    openUser(d.id);
  },
  review: async () => {
    if (needLogin()) return;
    const missing = [];
    if (!scores.taste) missing.push('맛');
    if (!scores.price) missing.push('가격');
    if (!scores.kind) missing.push('친절');
    if (!scores.clean) missing.push('청결');

    if (missing.length > 0) {
      toast('별점을 모두 입력해주세요: ' + missing.join(', ') + ' 누락');
      return;
    }

    let photoUrl = null;
    if (selectedPhotoBlob) {
      toast('사진 업로드 중...');
      const filePath = `${cur.id}/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.jpg`;
      const { error: upErr } = await db.storage.from('review-images').upload(filePath, selectedPhotoBlob, { contentType: 'image/jpeg' });
      if (upErr) {
        toast('사진 업로드 실패: ' + upErr.message);
        return;
      }
      const { data: { publicUrl } } = db.storage.from('review-images').getPublicUrl(filePath);
      photoUrl = publicUrl;
    }

    const finalScore = Math.round((scores.taste + scores.price + scores.kind + scores.clean) / 4);
    const { error } = await db.from('reviews').insert({
      place_id: cur.id,
      rating: finalScore,
      comment: $('c').value.trim() || null,
      photo_url: photoUrl
    });
    if (error){ toast('등록 실패: ' + error.message); return; }
    toast('평가가 등록되었어요!');
    await load(); openPlace(cur);
  },
  saveNew: async () => {
    if (needLogin()) return;
    let price = parseInt($('pr').value, 10), b = curBiz;
    if (!(price > 0)){ toast('금액을 입력해주세요'); return; }

    const missing = [];
    if (!scores.taste) missing.push('맛');
    if (!scores.price) missing.push('가격');
    if (!scores.kind) missing.push('친절');
    if (!scores.clean) missing.push('청결');

    if (missing.length > 0) {
      toast('별점을 모두 입력해주세요: ' + missing.join(', ') + ' 누락');
      return;
    }

    let photoUrl = null;
    const finalScore = Math.round((scores.taste + scores.price + scores.kind + scores.clean) / 4);

    const { data, error } = await db.from('places').insert({
      biz_id: b.id,
      name: b.name + (b.branch ? ' ' + b.branch : ''),
      kind: '간짜장',
      price,
      lat: b.lat,
      lng: b.lng,
      address: b.road_addr || b.lot_addr
    }).select().single();

    if (error){ toast('등록 실패: ' + error.message); return; }

    if (selectedPhotoBlob) {
      toast('사진 업로드 중...');
      const filePath = `${data.id}/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.jpg`;
      const { error: upErr } = await db.storage.from('review-images').upload(filePath, selectedPhotoBlob, { contentType: 'image/jpeg' });
      if (!upErr) {
        const { data: { publicUrl } } = db.storage.from('review-images').getPublicUrl(filePath);
        photoUrl = publicUrl;
      }
    }

    await db.from('reviews').insert({
      place_id: data.id,
      rating: finalScore,
      comment: $('c').value.trim() || null,
      photo_url: photoUrl
    });
    toast('새 매장과 리뷰가 등록되었어요!');
    await load();
    fetchNearbyBiz();
    openPlace(data);
  },
  sendAsk: async () => {
    if (needLogin()) return;
    const name = $('an').value.trim(); if (!name){ toast('가게 이름을 입력해주세요'); return; }
    const { error } = await db.from('store_requests').insert({ name, address: $('aa').value.trim() || null, note: $('ao').value.trim() || null });
    if (error){ toast('요청 실패: ' + error.message); return; }
    toast('등록 요청이 접수됐어요'); closeSheet();
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b && A[b.dataset.a]) A[b.dataset.a](b.dataset);
});

db.auth.getSession().then(({ data }) => { me = data.session?.user || null; paintMe(); });
db.auth.onAuthStateChange((_e, s) => { me = s?.user || null; paintMe(); });
function paintMe(){ $('me').textContent = me ? '내 정보' : '로그인'; }

function initMap(){
  try {
    const defaultCenter = new naver.maps.LatLng(37.5640, 126.9790);
    map = new naver.maps.Map('map', { center: defaultCenter, zoom: 15 });

    naver.maps.Event.addListener(map, 'click', () => { closeSheet(); closePopover(); $('res').hidden = true; });
    naver.maps.Event.addListener(map, 'idle', onMapIdle);

    drawPins();

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        if (!map) return;
        myCoord = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        const myLoc = new naver.maps.LatLng(myCoord.lat, myCoord.lng);
        map.setCenter(myLoc);
        map.setZoom(16);
      }, err => {
        console.warn('위치 확인 실패:', err.message);
      }, { timeout: 7000 });
    }
  } catch (e) {
    console.error('지도 초기화 실패:', e);
    toast('지도 오류: ' + e.message);
  }
}

window.navermap_authFailure = () => {
  toast('네이버 지도 인증 실패: 네이버 콘솔 웹 서비스 URL을 확인하세요');
};

load();

const s = document.createElement('script');
s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(CLIENT_ID) + '&ncpClientId=' + encodeURIComponent(CLIENT_ID);
s.onload = initMap;
s.onerror = () => toast('네이버 지도 API 스크립트 로드 실패');
document.head.appendChild(s);
</script>
