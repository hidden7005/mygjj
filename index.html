function getDistanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371e3;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

async function resizeImageFile(file, maxDimension = 1200, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDimension || h > maxDimension) {
          if (w > h) { h = Math.round((h * maxDimension) / w); w = maxDimension; }
          else { w = Math.round((w * maxDimension) / h); h = maxDimension; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('압축 실패')), 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function getRatingTier(avg){
  if (!avg || isNaN(avg)) return 'tier-none';
  const val = parseFloat(avg);
  if (val >= 4.5) return 'tier-gold';
  if (val >= 4.0) return 'tier-silver';
  if (val >= 3.5) return 'tier-bronze';
  if (val >= 3.0) return 'tier-titanium';
  if (val >= 2.0) return 'tier-neutral';
  return 'tier-muted';
}

      if (rv.is_real !== null && rv.is_real !== undefined) {
        realStats[rv.place_id].total++;
        if (rv.is_real === true) realStats[rv.place_id].yes++;
      }
    });

    drawPins();
  } catch(e) { console.error(e); }
}

function drawPins(){
  if (!map || typeof naver === 'undefined' || !naver.maps) return;
  markers.forEach(m => m.setMap(null));
  markers = [];

  if (radiusCircle) { radiusCircle.setMap(null); radiusCircle = null; }
  if (filterRadius300 && map) {
    const cp = myCoord ? new naver.maps.LatLng(myCoord.lat, myCoord.lng) : map.getCenter();
    radiusCircle = new naver.maps.Circle({
      map, center: cp, radius: 300, fillColor: '#0071e3', fillOpacity: 0.1,
      strokeColor: '#0071e3', strokeOpacity: 0.5, strokeWeight: 1.5
    });
  }

  let listToDraw = places.filter(p => {
    const rt = rate[p.id];
    const avg = rt ? parseFloat(rt.avg_rating) : 0;
    const roundedStars = Math.round(avg);
    const price = Number(p.price || 0);

    if (filterRating !== 'all' && roundedStars !== parseInt(filterRating, 10)) return false;
    if (filterPrice === 'under_6000' && price > 6000) return false;
    if (filterPrice === '7000_8000' && (price < 7000 || price > 8000)) return false;
    if (filterPrice === '8500_10000' && (price < 8500 || price > 10000)) return false;
    if (filterPrice === 'over_10000' && price <= 10000) return false;

    if (filterRadius300) {
      const refLat = myCoord ? myCoord.lat : map.getCenter().lat();
      const refLng = myCoord ? myCoord.lng : map.getCenter().lng();
      if (getDistanceMeters(refLat, refLng, parseFloat(p.lat), parseFloat(p.lng)) > 300) return false;
    }
    return true;
  });

  if (currentSort === 'price_asc') listToDraw.sort((a, b) => ((a.price || 0) - (b.price || 0)));
  else if (currentSort === 'price_desc') listToDraw.sort((a, b) => ((b.price || 0) - (a.price || 0)));

  const groups = {};
  listToDraw.forEach(p => {
    const key = `${parseFloat(p.lat).toFixed(5)},${parseFloat(p.lng).toFixed(5)}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  });

  Object.values(groups).forEach(list => {
    const first = list[0];
    const rt = rate[first.id];
    const avg = rt ? parseFloat(rt.avg_rating).toFixed(1) : null;
    const tierClass = getRatingTier(avg);

    // 90% 이상 인증 검증
    const st = realStats[first.id];
    const isAuthentic = st && st.total >= 1 && ((st.yes / st.total) >= 0.9);
    const badgeHtml = isAuthentic ? `<span class="real-badge">🔥 찐</span> ` : '';

    if (list.length === 1) {
      const p = first;
      const cntStr = rt && rt.n ? `(${rt.n})` : '';
      const rateBadge = avg ? `<span style="font-weight:700">★${avg}</span><span style="font-size:11px;opacity:0.8">${cntStr}</span>` : `<span style="font-size:11px">신규</span>`;
      const content = `<div class="pin ${tierClass}">${badgeHtml}<span style="font-weight:700">${esc(p.name)}</span> ${rateBadge}</div>`;

      const mk = new naver.maps.Marker({
        map, position: new naver.maps.LatLng(p.lat, p.lng),
        icon: { content, anchor: new naver.maps.Point(0, 0) }
      });
      naver.maps.Event.addListener(mk, 'click', () => openPlace(p));
      markers.push(mk);
    } else {
      const label = `${badgeHtml}${esc(first.name)} 외 ${list.length - 1}곳`;
      const mk = new naver.maps.Marker({
        map, position: new naver.maps.LatLng(first.lat, first.lng),
        icon: { content: `<div class="pin ${tierClass}">${label}</div>`, anchor: new naver.maps.Point(0, 0) }
      });
      naver.maps.Event.addListener(mk, 'click', () => openPlaceGroup(list));
      markers.push(mk);
    }
  });
}

function openPlaceGroup(list){
  const addr = list[0].address || '동일 건물 위치';
  sheet('<h2>' + esc(addr) + '</h2><p class="sub">등록된 가게가 ' + list.length + '개 있어요.</p>' +
    '<div style="margin-top:16px;border-radius:18px;overflow:hidden;background:var(--secondary-card-bg);border:0.5px solid var(--separator);">' +

const popEl = $('popover-menu');
const POP_MENUS = {
  rating: {
    title: '별점 필터',
    items: [
      { id: 'all', label: '전체 별점' },
      { id: '5', label: '★ 5개 매장만' }, { id: '4', label: '★ 4개 매장만' },
      { id: '3', label: '★ 3개 매장만' }, { id: '2', label: '★ 2개 매장만' }, { id: '1', label: '★ 1개 매장만' }
    ],
    getVal: () => filterRating,
    setVal: v => { filterRating = v; updatePillLabels(); drawPins(); }
  },
  price: {
    title: '가격대 필터',
    items: [
      { id: 'all', label: '전체 가격' },
      { id: 'under_6000', label: '6,000원 이하' }, { id: '7000_8000', label: '7,000원 ~ 8,000원' },
      { id: '8500_10000', label: '8,500원 ~ 10,000원' }, { id: 'over_10000', label: '10,000원 초과' }
    ],
    getVal: () => filterPrice,
    setVal: v => { filterPrice = v; updatePillLabels(); drawPins(); }
  },
  sort: {
    title: '정렬',
    items: [{ id: 'default', label: '기본 등록순' }, { id: 'price_asc', label: '₩ 금액 낮은순' }, { id: 'price_desc', label: '₩ 금액 높은순' }],
    getVal: () => currentSort,
    setVal: v => { currentSort = v; updatePillLabels(); drawPins(); }
  }
};

function updatePillLabels(){
  $('pill-rating').textContent = filterRating === 'all' ? '★ 별점 필터 ▾' : POP_MENUS.rating.items.find(x => x.id === filterRating).label + ' ▾';
  $('pill-rating').classList.toggle('filtered', filterRating !== 'all');
  $('pill-price').textContent = filterPrice === 'all' ? '₩ 가격대 필터 ▾' : POP_MENUS.price.items.find(x => x.id === filterPrice).label + ' ▾';
  $('pill-price').classList.toggle('filtered', filterPrice !== 'all');
  $('pill-sort').textContent = currentSort === 'default' ? '⇅ 정렬 ▾' : POP_MENUS.sort.items.find(x => x.id === currentSort).label + ' ▾';
  $('pill-sort').classList.toggle('filtered', currentSort !== 'default');
  $('pill-dist').textContent = filterRadius300 ? '📍 반경 300m 켜짐' : '📍 반경 300m';
  $('pill-dist').classList.toggle('filtered', filterRadius300);
  $('pill-reset').style.display = (filterRating !== 'all' || filterPrice !== 'all' || filterRadius300 || currentSort !== 'default') ? 'inline-flex' : 'none';
}

function openPopover(type, btnEl){
  if (openPopType === type) { closePopover(); return; }
  openPopType = type;
  const cfg = POP_MENUS[type]; if (!cfg) return;
  const curVal = cfg.getVal();
  popEl.innerHTML = cfg.items.map(it => `<button class="menu-item ${it.id === curVal ? 'selected' : ''}" data-item-id="${it.id}"><span>${esc(it.label)}</span>${it.id === curVal ? '<span class="check">✓</span>' : ''}</button>`).join('');
  const rect = btnEl.getBoundingClientRect();
  popEl.style.left = Math.max(12, Math.min(rect.left, window.innerWidth - 300)) + 'px';
  popEl.hidden = false;
}
function closePopover(){ openPopType = null; popEl.hidden = true; }

$('sort-bar').addEventListener('click', e => {
  const btn = e.target.closest('.sort-pill'); if (!btn) return;
  if (btn.id === 'pill-reset') {
    filterRating = 'all'; filterPrice = 'all'; filterRadius300 = false; currentSort = 'default';
    updatePillLabels(); closePopover(); drawPins(); toast('모든 필터가 초기화되었어요'); return;
  }
  if (btn.dataset.action === 'toggleDist') {
    filterRadius300 = !filterRadius300; updatePillLabels(); closePopover();
    if (filterRadius300 && myCoord && map) map.panTo(new naver.maps.LatLng(myCoord.lat, myCoord.lng));
    toast(filterRadius300 ? '반경 300m 매장을 표시해요' : '반경 300m 필터가 해제되었어요');
    drawPins(); return;
  }
  if (btn.dataset.pop) openPopover(btn.dataset.pop, btn);
});

popEl.addEventListener('click', e => {
  const item = e.target.closest('.menu-item'); if (!item || !openPopType) return;
  POP_MENUS[openPopType].setVal(item.dataset.itemId); closePopover();
});
document.addEventListener('click', e => { if (!e.target.closest('#sort-bar') && !e.target.closest('#popover-menu')) closePopover(); });

  showTerms: () => {

  showPrivacy: () => {

      '<div style="margin-top:14px;font-size:14px;line-height:1.6;color:var(--label-secondary);max-height:60vh;overflow-y:auto;">' +
      '<p><b>1. 수집하는 개인정보</b><br>- 소셜 로그인 정보(이메일, 고유 식별자, 닉네임, 프로필 사진)</p><br>' +
      '<p><b>2. 수집 및 이용 목적</b><br>- 회원 식별, 리뷰 작성자 표시, 북마크 저장 관리</p><br>' +
      '<p><b>3. 보유 및 파기</b><br>- 회원 탈퇴 시 수집된 개인 식별 정보는 지체 없이 영구 파기됩니다.</p>' +
      '</div>');
  },
  withdraw: async () => {
    if (!me) return;
    if (!confirm('정말 탈퇴하시겠습니까?\n탈퇴 시 내 프로필 및 즐겨찾기 정보가 영구 삭제됩니다.')) return;
    try {
      await Promise.all([
        db.from('favorites').delete().eq('user_id', me.id),
        db.from('profiles').delete().eq('id', me.id)
      ]);
      await db.auth.signOut();
      closeSheet();
      toast('회원 탈퇴가 완료되었어요');
    } catch(err) {
      toast('탈퇴 처리 실패: ' + err.message);
    }

  editNick: () => openNicknamePrompt(false),
  saveNickname: async () => {
    const val = $('nick-input').value.trim();
    if (val.length < 2) { toast('닉네임은 2자 이상 입력해주세요'); return; }
    if (containsBadWords(val)) { toast('부적절한 닉네임은 사용할 수 없어요'); return; }
    const { error } = await db.from('profiles').upsert({ id: me.id, username: val });
    if (error) { toast('닉네임 저장 실패: ' + error.message); return; }

    toast('닉네임이 설정되었어요!');

  place: d => { const p = places.find(x => x.id === d.id); if (p) openPlace(p); },
  pick: d => openNew(biz[d.id]),
  score: d => { scores[d.cat] = +d.n; updateStarsUI(); },
  login: d => db.auth.signInWithOAuth({ provider: d.p, options: { redirectTo: location.origin + location.pathname } }),
  logout: async () => { await db.auth.signOut(); closeSheet(); },
  user: d => openUser(d.id),
  fav: async () => {
    if (needLogin()) return;
    const { data } = await db.from('favorites').select('place_id').eq('place_id', cur.id).maybeSingle();
    if (data) await db.from('favorites').delete().eq('place_id', cur.id);
    else await db.from('favorites').insert({ place_id: cur.id });

  review: async () => {
    if (needLogin()) return;

    const commentVal = $('c')?.value.trim() || '';
    if (containsBadWords(commentVal)) {
      toast('욕설이나 비방 표현은 등록할 수 없어요');
      return;

    const missing = [];
    if (!scores.taste) missing.push('맛');
    if (!scores.price) missing.push('가격');
    if (!scores.kind) missing.push('친절');
    if (missing.length > 0) { toast('별점을 모두 입력해주세요: ' + missing.join(', ')); return; }

    // 기존 매장 가격이 비어있던 경우 가격 보완 입력
    if ($('pr')) {
      const priceVal = parseInt($('pr').value, 10);
      if (priceVal > 0) {
        await db.from('places').update({ price: priceVal }).eq('id', cur.id);
        cur.price = priceVal;
      }
    }

    let photoUrl = null;
    if (selectedPhotoBlob) {
      toast('사진 업로드 중...');
      const filePath = `${cur.id}/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.jpg`;
      const { error: upErr } = await db.storage.from('review-images').upload(filePath, selectedPhotoBlob, { contentType: 'image/jpeg' });
      if (!upErr) photoUrl = db.storage.from('review-images').getPublicUrl(filePath).data.publicUrl;
    }

    const finalScore = parseFloat(((scores.taste + scores.price + scores.kind) / 3).toFixed(1));
    const { error } = await db.from('reviews').insert({
      place_id: cur.id,
      rating: finalScore,
      taste: scores.taste,
      price_score: scores.price,
      kind: scores.kind,
      is_real: scores.is_real,
      comment: $('c').value.trim() || null,
      photo_url: photoUrl
    });
    if (error){ toast('등록 실패: ' + error.message); return; }
    toast('평가가 입력되었어요!');
    await load(); openPlace(cur);
  },
  saveNew: async () => {
    if (needLogin()) return;
    let price = parseInt($('pr')?.value, 10), b = curBiz;
    if (!(price > 0)){ toast('간짜장 가격을 입력해주세요'); return; }
    if (scores.is_real === null) { toast('1번: 진짜 간짜장인지 선택해주세요'); return; }
    const commentVal = $('c')?.value.trim() || '';
    if (containsBadWords(commentVal)) {
      toast('욕설이나 비방 표현은 등록할 수 없어요');
      return;
    }
    const missing = [];
    if (!scores.taste) missing.push('맛');
    if (!scores.price) missing.push('가격');
    if (!scores.kind) missing.push('친절');
    if (missing.length > 0) { toast('별점을 모두 입력해주세요: ' + missing.join(', ')); return; }

    const finalScore = parseFloat(((scores.taste + scores.price + scores.kind) / 3).toFixed(1));
    const { data, error } = await db.from('places').insert({
      biz_id: b.id, name: b.name + (b.branch ? ' ' + b.branch : ''),
      kind: '간짜장', price, lat: b.lat, lng: b.lng, address: b.road_addr || b.lot_addr
    }).select().single();

    if (error){ toast('등록 실패: ' + error.message); return; }

    let photoUrl = null;
    if (selectedPhotoBlob) {
      toast('사진 업로드 중...');
      const filePath = `${data.id}/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.jpg`;
      const { error: upErr } = await db.storage.from('review-images').upload(filePath, selectedPhotoBlob, { contentType: 'image/jpeg' });
      if (!upErr) photoUrl = db.storage.from('review-images').getPublicUrl(filePath).data.publicUrl;
    }

    await db.from('reviews').insert({
      place_id: data.id,
      rating: finalScore,
      taste: scores.taste,
      price_score: scores.price,
      kind: scores.kind,
      is_real: scores.is_real,
      comment: $('c').value.trim() || null,
      photo_url: photoUrl
    });

    toast('가게 정보가 입력되었어요!');
    await load(); openPlace(data);
  }
};

  if (!data?.username && !user.user_metadata?.username) {

db.auth.onAuthStateChange((_e, s) => {

});
function paintMe(){ $('me').textContent = me ? '내 정보' : '로그인'; }

function initMap(){
  try {
    map = new naver.maps.Map('map', { center: new naver.maps.LatLng(37.5640, 126.9790), zoom: 15 });
    naver.maps.Event.addListener(map, 'click', () => { closeSheet(); closePopover(); $('res').hidden = true; });
    naver.maps.Event.addListener(map, 'idle', onMapIdle);
    drawPins();

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        if (!map) return;
        myCoord = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        map.setCenter(new naver.maps.LatLng(myCoord.lat, myCoord.lng));
      }, err => console.warn(err.message), { timeout: 7000 });
    }
  } catch (e) { toast('지도 오류: ' + e.message); }
}

let moveDebounce;
function onMapIdle(){
  clearTimeout(moveDebounce);
  moveDebounce = setTimeout(fetchNearbyBiz, 500); // 500ms 디바운스로 트래픽 방어
}

// ⭐ 최적화: 줌 레벨 16 이상에서만 호출, 1회 최대 25개로 축소
async function fetchNearbyBiz(){
  if (!map) return;
  try {
    const zoom = map.getZoom();
    if (zoom < 16) {
      nearbyMarkers.forEach(m => m.setMap(null));
      nearbyMarkers = [];
      return;
    }
    const bounds = map.getBounds();
    if (!bounds) return;
    const sw = bounds.getSW(), ne = bounds.getNE();
    if (!sw || !ne) return;

    const { data } = await db.from('biz_master')
      .select('*')
      .gte('lat', sw.lat()).lte('lat', ne.lat())
      .gte('lng', sw.lng()).lte('lng', ne.lng())
      .limit(25);

    if (!data) return;

    const registeredBizIds = new Set(places.map(p => p.biz_id));
    const unregistered = data.filter(b => !registeredBizIds.has(b.id));
    nearbyMarkers.forEach(m => m.setMap(null));
    nearbyMarkers = [];

    unregistered.forEach(b => {
      biz[b.id] = b;
      const mk = new naver.maps.Marker({
        map, position: new naver.maps.LatLng(b.lat, b.lng),
        icon: { content: '<div class="pin biz">+ ' + esc(b.name) + '</div>', anchor: new naver.maps.Point(0, 0) }
      });
      naver.maps.Event.addListener(mk, 'click', () => openNew(b));
      nearbyMarkers.push(mk);
    });
  } catch (err) {
    console.warn('주변 매장 조회 예외 방어:', err);
  }
}

$('q').oninput = e => { clearTimeout(st); st = setTimeout(() => search(e.target.value.trim()), 250); };
let st;
async function search(q){
  const box = $('res'); if (!q){ box.hidden = true; return; }
  const local = places.filter(p => p.name.includes(q)).slice(0, 10);
  const { data } = await db.from('biz_master').select('*').ilike('name', '%' + q.replace(/[%_]/g, '') + '%').limit(20);
  const reg = new Set(places.map(p => p.biz_id));
  const rows = (data || []).filter(b => !reg.has(b.id));
  biz = Object.fromEntries(rows.map(b => [b.id, b]));

  let h = local.map(p => '<button class="row" data-a="place" data-id="' + esc(p.id) + '"><b>' + esc(p.name) + '</b><small>' + esc(p.address) + '</small><i>' + won(p.price) + '원</i></button>').join('');
  h += rows.map(b => '<button class="row" data-a="pick" data-id="' + esc(b.id) + '"><b>' + esc(b.name) + '</b><small>' + esc(b.road_addr || b.lot_addr) + ' · 등록 가능</small></button>').join('');
  box.innerHTML = h; box.hidden = false;
}
