<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MYGJJ</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--glass:rgba(255,255,255,.8)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--sub:#a1a1a6;--line:#38383a;--glass:rgba(28,28,30,.8)}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#map{position:absolute;inset:0;width:100%;height:100%;background:#e5e5ea}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 2px 14px rgba(0,0,0,.14)}
#top{position:absolute;z-index:5;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:8px;max-width:520px}
#q{flex:1;min-width:0;height:46px;border:0;border-radius:14px;padding:0 16px;font-size:17px;color:var(--ink)}
#q::placeholder{color:var(--sub)}
#q:focus{outline:2px solid var(--blue)}
#me{height:46px;padding:0 16px;border:0;border-radius:14px;font-size:15px;font-weight:600}
#res{position:absolute;z-index:5;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);max-width:520px;max-height:55%;overflow:auto;border-radius:14px}
#res[hidden]{display:none}
.row{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 16px;border-bottom:1px solid var(--line);position:relative}
.row b{display:block;font-size:16px}
.row small{color:var(--sub);font-size:13px}
.row i{position:absolute;right:16px;top:14px;font-style:normal;font-weight:600;color:var(--blue)}
.ask{color:var(--blue);border:0}
.empty{padding:14px 16px;color:var(--sub)}
.pin{transform:translate(-50%,-100%);background:var(--card);color:var(--ink);font:600 14px -apple-system,sans-serif;padding:6px 11px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25);white-space:nowrap}
#sheet{position:absolute;z-index:8;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px);box-shadow:0 -4px 24px rgba(0,0,0,.2);transform:translateY(110%);transition:transform .25s ease}
#sheet.open{transform:none}
.x{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);color:var(--sub)}
h2{font-size:24px;font-weight:700;letter-spacing:-.02em;padding-right:34px}
h3{font-size:17px;margin:20px 0 6px}
.sub{color:var(--sub);font-size:14px;margin-top:4px}
.stats{display:flex;gap:10px;margin:16px 0}
.stats div{flex:1;background:var(--bg);border-radius:14px;padding:12px 14px}
.stats small{display:block;color:var(--sub);font-size:12px}
.stats b{font-size:24px;font-weight:700}
.stats span{font-size:14px;color:var(--sub);font-weight:500}
.btns{display:flex;flex-direction:column;gap:8px}
.btn{display:block;text-align:center;text-decoration:none;color:var(--ink);background:var(--bg);border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:600;width:100%}
.btn.primary{background:var(--blue);color:#fff}
input,select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;background:var(--card);color:var(--ink);margin-top:8px}
.stars{display:flex;gap:4px;margin:12px 0 4px}
.st{border:0;background:none;font-size:34px;color:var(--line);padding:0 2px}
.st.on{color:#ff9f0a}
.rv{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.u{border:0;background:none;color:var(--blue);font-weight:600;padding:0;margin-right:6px}
#toast{position:absolute;z-index:9;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%}
#toast[hidden]{display:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (min-width:760px){#sheet{left:12px;right:auto;bottom:12px;width:400px;max-height:calc(100% - 24px);border-radius:22px}}
</style>
</head>
<body>
<div id="map"></div>
<div id="top"><input id="q" class="glass" type="search" placeholder="가게 이름 검색" autocomplete="off" aria-label="가게 이름 검색"><button id="me" class="glass" data-a="me">로그인</button></div>
<div id="res" class="glass" hidden></div>
<div id="toast" hidden></div>
<section id="sheet" aria-live="polite"></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CLIENT_ID = 'd0j0x8a40f';
const db = supabase.createClient('https://aitolwzpiencyfunjhkp.supabase.co', 'sb_publishable_IdeiksyY68b_r85K69EANg_kW04pydm');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = v => Number(v).toLocaleString('ko-KR');
let map = null, markers = [], places = [], rate = {}, me = null, cur = null, curBiz = null, biz = {}, stars = 0, tt;

function toast(t){ const e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(tt); tt = setTimeout(() => e.hidden = true, 3500); }
function sheet(h){ $('sheet').innerHTML = '<button class="x" data-a="close" aria-label="닫기">✕</button>' + h; $('sheet').classList.add('open'); $('res').hidden = true; stars = 0; }
function needLogin(){ if (!me){ openLogin(); return true; } return false; }

async function load(){
  const [p, r] = await Promise.all([db.from('places').select('*'), db.from('place_ratings').select('*')]);
  if (p.error || r.error){ toast('데이터를 불러오지 못했어요: ' + (p.error || r.error).message); return; }
  rate = {}; r.data.forEach(x => rate[x.place_id] = x);
  places = p.data; drawPins();
}
function drawPins(){
  if (!map) return;
  markers.forEach(m => m.setMap(null));
  markers = places.map(p => {
    const mk = new naver.maps.Marker({ map, position: new naver.maps.LatLng(p.lat, p.lng), icon: { content: '<div class="pin">' + won(p.price) + '</div>', anchor: new naver.maps.Point(0, 0) } });
    naver.maps.Event.addListener(mk, 'click', () => openPlace(p));
    return mk;
  });
}

// ── 검색
$('q').oninput = e => { clearTimeout(st); st = setTimeout(() => search(e.target.value.trim()), 250); };
let st;
async function search(q){
  const box = $('res');
  if (!q){ box.hidden = true; return; }
  const local = places.filter(p => p.name.includes(q)).slice(0, 10);
  const { data, error } = await db.from('biz_master').select('*').ilike('name', '%' + q.replace(/[%_]/g, '') + '%').limit(20);
  const reg = new Set(places.map(p => p.biz_id));
  const rows = (data || []).filter(b => !reg.has(b.id));
  biz = Object.fromEntries(rows.map(b => [b.id, b]));
  let h = local.map(p => '<button class="row" data-a="place" data-id="' + esc(p.id) + '"><b>' + esc(p.name) + '</b><small>' + esc(p.address) + '</small><i>' + won(p.price) + '원</i></button>').join('');
  h += rows.map(b => '<button class="row" data-a="pick" data-id="' + esc(b.id) + '"><b>' + esc(b.name) + (b.branch ? ' ' + esc(b.branch) : '') + '</b><small>' + esc(b.road_addr || b.lot_addr) + ' · 아직 등록 전</small></button>').join('');
  if (error) h += '<div class="empty">검색 오류: ' + esc(error.message) + '</div>';
  else if (!local.length && !rows.length) h += '<div class="empty">“' + esc(q) + '” 검색 결과가 없어요</div>';
  h += '<button class="row ask" data-a="ask" data-q="' + esc(q) + '">찾는 가게가 없나요? 등록 요청하기</button>';
  box.innerHTML = h; box.hidden = false;
}

// ── 가게 상세
function stBox(){ return '<div class="stars" role="group" aria-label="별점">' + [1,2,3,4,5].map(n => '<button class="st" data-a="star" data-n="' + n + '" aria-label="' + n + '점">★</button>').join('') + '</div><input id="c" placeholder="한줄평 (선택)" maxlength="100">'; }
async function openPlace(p){
  cur = p; const rt = rate[p.id], addr = p.address || '';
  let fav = null; if (me) fav = (await db.from('favorites').select('place_id').eq('place_id', p.id).maybeSingle()).data;
  const rv = (await db.from('reviews').select('rating,comment,user_id,profiles(username)').eq('place_id', p.id).order('created_at', { ascending: false }).limit(10)).data || [];
  sheet('<h2>' + esc(p.name) + '</h2><p class="sub">' + esc(p.kind) + ' · ' + esc(addr) + '</p>' +
    '<div class="stats"><div><small>금액</small><b>' + won(p.price) + '원</b></div><div><small>평점</small><b>' + (rt ? rt.avg_rating + ' <span>/ 5 (' + rt.n + ')</span>' : '-') + '</b></div></div>' +
    '<div class="btns"><a class="btn" target="_blank" rel="noopener" href="https://map.naver.com/p/search/' + encodeURIComponent(p.name + ' ' + addr) + '">네이버맵에서 보기</a>' +
    '<a class="btn" target="_blank" rel="noopener" href="https://map.kakao.com/link/map/' + encodeURIComponent(p.name) + ',' + p.lat + ',' + p.lng + '">카카오맵에서 보기</a>' +
    '<button class="btn" data-a="fav">' + (fav ? '♥ 즐겨찾기 해제' : '♡ 즐겨찾기') + '</button></div>' +
    '<h3>평점 남기기</h3>' + stBox() + '<button class="btn primary" style="margin-top:10px" data-a="review">등록</button>' +
    '<h3>리뷰</h3>' + (rv.length ? rv.map(r => '<div class="rv"><button class="u" data-a="user" data-id="' + esc(r.user_id) + '">@' + esc(r.profiles?.username || '익명') + '</button>' + '★'.repeat(r.rating) + (r.comment ? '<br>' + esc(r.comment) : '') + '</div>').join('') : '<p class="sub">아직 리뷰가 없어요</p>'));
  if (map) map.panTo(new naver.maps.LatLng(p.lat, p.lng));
}
function openNew(b){
  curBiz = b;
  sheet('<h2>' + esc(b.name) + (b.branch ? ' ' + esc(b.branch) : '') + '</h2><p class="sub">' + esc(b.road_addr || b.lot_addr) + '</p>' +
    '<h3>이 가게 등록하기</h3><select id="kd"><option>간짜장</option><option>짜장면</option></select><input id="pr" type="number" inputmode="numeric" placeholder="금액 (원)">' +
    stBox() + '<button class="btn primary" style="margin-top:10px" data-a="saveNew">등록하기</button>');
}
function openAsk(q){
  sheet('<h2>등록 요청</h2><p class="sub">찾는 가게가 없으면 알려주세요. 확인 후 추가할게요.</p><input id="an" value="' + esc(q) + '" placeholder="가게 이름"><input id="aa" placeholder="주소 또는 위치"><input id="ao" placeholder="메모 (선택)"><button class="btn primary" style="margin-top:10px" data-a="sendAsk">요청 보내기</button>');
}
function openLogin(){
  sheet('<h2>로그인</h2><p class="sub">평점, 즐겨찾기, 팔로우를 쓰려면 로그인하세요.</p><div class="btns" style="margin-top:16px"><button class="btn primary" data-a="login" data-p="google">Google로 계속하기</button><button class="btn" data-a="login" data-p="kakao">카카오로 계속하기</button></div>');
}
async function openUser(uid){
  const { data: s } = await db.from('profile_stats').select('*').eq('id', uid).maybeSingle();
  if (!s){ toast('유저를 찾을 수 없어요'); return; }
  let fl = null; if (me && me.id !== uid) fl = (await db.from('follows').select('followee_id').eq('follower_id', me.id).eq('followee_id', uid).maybeSingle()).data;
  sheet('<h2>@' + esc(s.username) + '</h2><div class="stats"><div><small>게시물</small><b>' + s.post_count + '</b></div><div><small>평균 평점</small><b>' + (s.avg_rating ?? '-') + '</b></div></div>' +
    (me && me.id !== uid ? '<button class="btn primary" data-a="follow" data-id="' + esc(uid) + '" data-on="' + (fl ? 1 : 0) + '">' + (fl ? '팔로잉' : '팔로우') + '</button>' : '') +
    (me && me.id === uid ? '<button class="btn" data-a="logout">로그아웃</button>' : ''));
}

// ── 동작
const A = {
  close: () => $('sheet').classList.remove('open'),
  me: () => me ? openUser(me.id) : openLogin(),
  place: d => { const p = places.find(x => x.id === d.id); if (p) openPlace(p); },
  pick: d => openNew(biz[d.id]),
  ask: d => openAsk(d.q),
  star: d => { stars = +d.n; document.querySelectorAll('.st').forEach((s, i) => s.classList.toggle('on', i < stars)); },
  login: d => db.auth.signInWithOAuth({ provider: d.p, options: { redirectTo: location.origin + location.pathname } }).then(r => r.error && toast('로그인 설정이 아직 안 됐어요: ' + r.error.message)),
  logout: async () => { await db.auth.signOut(); A.close(); },
  user: d => openUser(d.id),
  fav: async () => {
    if (needLogin()) return;
    const { data } = await db.from('favorites').select('place_id').eq('place_id', cur.id).maybeSingle();
    if (data) await db.from('favorites').delete().eq('place_id', cur.id); else await db.from('favorites').insert({ place_id: cur.id });
    openPlace(cur);
  },
  follow: async d => {
    if (needLogin()) return;
    if (d.on === '1') await db.from('follows').delete().eq('follower_id', me.id).eq('followee_id', d.id);
    else await db.from('follows').insert({ followee_id: d.id });
    openUser(d.id);
  },
  review: async () => {
    if (needLogin()) return;
    if (!stars){ toast('별점을 선택해주세요'); return; }
    const { error } = await db.from('reviews').insert({ place_id: cur.id, rating: stars, comment: $('c').value.trim() || null });
    if (error){ toast('등록 실패: ' + error.message); return; }
    await load(); openPlace(cur);
  },
  saveNew: async () => {
    if (needLogin()) return;
    const price = parseInt($('pr').value, 10), b = curBiz;
    if (!(price > 0) || !stars){ toast('금액과 별점을 입력해주세요'); return; }
    const { data, error } = await db.from('places').insert({ biz_id: b.id, name: b.name + (b.branch ? ' ' + b.branch : ''), kind: $('kd').value, price, lat: b.lat, lng: b.lng, address: b.road_addr || b.lot_addr }).select().single();
    if (error){ toast('등록 실패: ' + error.message); return; }
    await db.from('reviews').insert({ place_id: data.id, rating: stars, comment: $('c').value.trim() || null });
    await load(); openPlace(data);
  },
  sendAsk: async () => {
    if (needLogin()) return;
    const name = $('an').value.trim(); if (!name){ toast('가게 이름을 입력해주세요'); return; }
    const { error } = await db.from('store_requests').insert({ name, address: $('aa').value.trim() || null, note: $('ao').value.trim() || null });
    if (error){ toast('요청 실패: ' + error.message); return; }
    toast('등록 요청이 접수됐어요'); A.close();
  }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && A[b.dataset.a]) A[b.dataset.a](b.dataset); });

db.auth.getSession().then(({ data }) => { me = data.session?.user || null; paintMe(); });
db.auth.onAuthStateChange((_e, s) => { me = s?.user || null; paintMe(); });
function paintMe(){ $('me').textContent = me ? '내 정보' : '로그인'; }

function initMap(){
  try {
    map = new naver.maps.Map('map', { center: new naver.maps.LatLng(37.5640, 126.9790), zoom: 15 });
    naver.maps.Event.addListener(map, 'click', () => { A.close(); $('res').hidden = true; });
    drawPins();
  } catch (e) { toast('지도 오류: ' + e.message); }
}
window.navermap_authFailure = () => toast('지도 인증 실패: ' + location.origin + ' 주소를 네이버 Application에 등록해주세요');
load();
const s = document.createElement('script');
s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(CLIENT_ID);
s.onload = initMap; s.onerror = () => toast('지도 스크립트를 불러오지 못했어요');
document.head.appendChild(s);
</script>
</body>
</html>
