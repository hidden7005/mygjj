<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MYGJJ</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--glass:rgba(255,255,255,.8);--gold:#ff9f0a}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--sub:#a1a1a6;--line:#38383a;--glass:rgba(28,28,30,.8);--gold:#ffb340}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#map{position:absolute;inset:0;width:100%;height:100%;background:#e5e5ea;z-index:1}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 2px 14px rgba(0,0,0,.14)}
#top{position:absolute;z-index:5;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:8px;max-width:520px}
#q{flex:1;min-width:0;height:46px;border:0;border-radius:14px;padding:0 16px;font-size:17px;color:var(--ink)}
#q::placeholder{color:var(--sub)}
#q:focus{outline:2px solid var(--blue)}
#me{height:46px;padding:0 16px;border:0;border-radius:14px;font-size:15px;font-weight:600}
#res{position:absolute;z-index:5;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);max-width:520px;max-height:55%;overflow:auto;border-radius:14px}
#res[hidden]{display:none}
.row{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 16px;border-bottom:1px solid var(--line);position:relative}
.row b{display:block;font-size:16px}
.row small{color:var(--sub);font-size:13px}
.row i{position:absolute;right:16px;top:14px;font-style:normal;font-weight:600;color:var(--blue)}
.ask{color:var(--blue);border:0}
.empty{padding:14px 16px;color:var(--sub)}

.pin{transform:translate(-50%,-100%);background:var(--card);color:var(--ink);font:600 14px -apple-system,sans-serif;padding:6px 11px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25);white-space:nowrap;cursor:pointer}
.pin.biz{background:var(--bg);color:var(--sub);font-weight:500;font-size:12px;border:1px dashed var(--line);padding:4px 9px}

#ver-badge{position:absolute;z-index:6;right:10px;top:calc(env(safe-area-inset-top,0px) + 12px);font-size:11px;font-weight:600;color:var(--sub);background:var(--glass);padding:3px 7px;border-radius:8px;pointer-events:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

#sheet{position:absolute;z-index:8;left:0;right:0;bottom:0;max-height:85%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px);box-shadow:0 -4px 24px rgba(0,0,0,.2);transform:translateY(110%);transition:transform .25s ease}
#sheet.open{transform:none}
.x{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);color:var(--sub)}
h2{font-size:24px;font-weight:700;letter-spacing:-.02em;padding-right:34px}
h3{font-size:16px;margin:18px 0 8px;font-weight:600}
.sub{color:var(--sub);font-size:14px;margin-top:4px}
.stats{display:flex;gap:10px;margin:16px 0}
.stats div{flex:1;background:var(--bg);border-radius:14px;padding:12px 14px}
.stats small{display:block;color:var(--sub);font-size:12px}
.stats b{font-size:22px;font-weight:700}
.stats span{font-size:13px;color:var(--sub);font-weight:500}
.btns{display:flex;flex-direction:column;gap:8px}
.btn{display:block;text-align:center;text-decoration:none;color:var(--ink);background:var(--bg);border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:600;width:100%}
.btn.primary{background:var(--blue);color:#fff}
input,select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;background:var(--card);color:var(--ink);margin-top:6px}

.price-ctrl{display:flex;gap:6px;margin-top:6px}
.price-btn{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 0;font-size:13px;font-weight:600;color:var(--ink)}

.rating-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg);padding:12px;border-radius:14px;margin-top:8px}
.rating-item{background:var(--card);padding:10px 12px;border-radius:10px;display:flex;flex-direction:column;gap:4px}
.rating-item.full{grid-column:span 2;background:rgba(255,159,10,.08);border:1px solid rgba(255,159,10,.25)}
.rating-item label{font-size:13px;font-weight:600;color:var(--sub)}
.rating-item.full label{color:var(--ink);font-size:14px}
.star-row{display:flex;align-items:center;gap:2px}
.star-btn{border:0;background:none;font-size:20px;color:var(--line);padding:0 1px;line-height:1}
.star-btn.on{color:var(--gold)}
.total-score{margin-left:auto;font-size:18px;font-weight:700;color:var(--gold)}

.rv{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.u{border:0;background:none;color:var(--blue);font-weight:600;padding:0;margin-right:6px}
#toast{position:absolute;z-index:99;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (min-width:760px){#sheet{left:12px;right:auto;bottom:12px;width:420px;max-height:calc(100% - 24px);border-radius:22px}}
</style>
</head>
<body>
<div id="map"></div>
<div id="ver-badge">v0.010</div>
<div id="top"><input id="q" class="glass" type="search" placeholder="가게 이름 검색" autocomplete="off" aria-label="가게 이름 검색"><button id="me" class="glass" data-a="me">로그인</button></div>
<div id="res" class="glass" hidden></div>
<div id="toast" hidden></div>
<section id="sheet" aria-live="polite"></section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CLIENT_ID = 'd0j0x8a40f';
const db = supabase.createClient('https://aitolwzpiencyfunjhkp.supabase.co', 'sb_publishable_IdeiksyY68b_r85K69EANg_kW04pydm');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = v => Number(v || 0).toLocaleString('ko-KR');

let map = null, markers = [], nearbyMarkers = [], places = [], rate = {}, me = null, cur = null, curBiz = null, biz = {}, tt;
let scores = { taste: 0, price: 0, kind: 0, clean: 0 };

function toast(t){ const e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(tt); tt = setTimeout(() => e.hidden = true, 4000); }
function sheet(h){ $('sheet').innerHTML = '<button class="x" data-a="close" aria-label="닫기">✕</button>' + h; $('sheet').classList.add('open');$('res').hidden = true; resetScores(); }
function needLogin(){ if (!me){ openLogin(); return true; } return false; }
function resetScores(){ scores = { taste: 0, price: 0, kind: 0, clean: 0 }; }

async function load(){
  try {
    const [p, r] = await Promise.all([db.from('places').select('*'), db.from('place_ratings').select('*')]);
    rate = {}; (r.data || []).forEach(x => rate[x.place_id] = x);
    places = p.data || [];
    drawPins();
  } catch(e) { console.error(e); }
}

function drawPins(){
  if (!map || typeof naver === 'undefined' || !naver.maps) return;
  markers.forEach(m => m.setMap(null));
  markers = places.map(p => {
    const mk = new naver.maps.Marker({
      map,
      position: new naver.maps.LatLng(p.lat, p.lng),
      icon: { content: '<div class="pin">' + won(p.price) + '</div>', anchor: new naver.maps.Point(0, 0) }
    });
    naver.maps.Event.addListener(mk, 'click', () => openPlace(p));
    return mk;
  });
}

let moveDebounce;
function onMapIdle(){
  clearTimeout(moveDebounce);
  moveDebounce = setTimeout(fetchNearbyBiz, 350);
}

async function fetchNearbyBiz(){
  if (!map) return;
  try {
    const zoom = map.getZoom();
    if (zoom < 14){
      nearbyMarkers.forEach(m => m.setMap(null));
      nearbyMarkers = [];
      return;
    }
    const bounds = map.getBounds();
    if (!bounds) return;
    const sw = bounds.getSW(), ne = bounds.getNE();
    if (!sw || !ne) return;

    const { data, error } = await db.from('biz_master')
      .select('*')
      .gte('lat', sw.lat()).lte('lat', ne.lat())
      .gte('lng', sw.lng()).lte('lng', ne.lng())
      .limit(30);

    if (error || !data) return;
    const registeredBizIds = new Set(places.map(p => p.biz_id));
    const unregistered = data.filter(b => !registeredBizIds.has(b.id));

    nearbyMarkers.forEach(m => m.setMap(null));
    nearbyMarkers = unregistered.map(b => {
      biz[b.id] = b;
      const mk = new naver.maps.Marker({
        map,
        position: new naver.maps.LatLng(b.lat, b.lng),
        icon: { content: '<div class="pin biz">+ ' + esc(b.name) + '</div>', anchor: new naver.maps.Point(0, 0) }
      });
      naver.maps.Event.addListener(mk, 'click', () => openNew(b));
      return mk;
    });
  } catch (err) {
    console.warn('주변 매장 조회 예외 방어:', err);
  }
}

function renderRatingComponent(){
  return `
    <div class="rating-grid">
      <div class="rating-item">
        <label>1. 진짜 간짜장</label>
        <div class="star-row">${[1,2,3,4,5].map(n => `<button class="star-btn" data-a="score" data-cat="taste" data-n="${n}">★</button>`).join('')}</div>
      </div>
      <div class="rating-item">
        <label>2. 금액</label>
        <div class="star-row">${[1,2,3,4,5].map(n => `<button class="star-btn" data-a="score" data-cat="price" data-n="${n}">★</button>`).join('')}</div>
      </div>
      <div class="rating-item">
        <label>3. 친절도</label>
        <div class="star-row">${[1,2,3,4,5].map(n => `<button class="star-btn" data-a="score" data-cat="kind" data-n="${n}">★</button>`).join('')}</div>
      </div>
      <div class="rating-item">
        <label>4. 청결</label>
        <div class="star-row">${[1,2,3,4,5].map(n => `<button class="star-btn" data-a="score" data-cat="clean" data-n="${n}">★</button>`).join('')}</div>
      </div>
      <div class="rating-item full">
        <div style="display:flex;align-items:center;">
          <label>5. 종합 (1~4 평균)</label>
          <span class="total-score" id="total-score">- / 5.0</span>
        </div>
      </div>
    </div>
    <input id="c" placeholder="한줄평 (선택)" maxlength="100">
  `;
}

function updateStarsUI(){
  document.querySelectorAll('.star-btn').forEach(btn => {
    const cat = btn.dataset.cat;
    const n = +btn.dataset.n;
    btn.classList.toggle('on', n <= (scores[cat] || 0));
  });
  const vals = [scores.taste, scores.price, scores.kind, scores.clean].filter(v => v > 0);
  const avg = vals.length ? (vals.reduce((a, b) => a + b, 0) / 4).toFixed(1) : '-';
  const el = $('total-score');
  if (el) el.textContent = avg === '-' ? '- / 5.0' : `★ ${avg} / 5.0`;
}

function adjustPrice(diff){
  const el = $('pr');
  if (!el) return;
  let val = Math.max(0, (parseInt(el.value, 10) || 0) + diff);
  val = Math.round(val / 100) * 100;
  el.value = val;
}

$('q').oninput = e => { clearTimeout(st); st = setTimeout(() => search(e.target.value.trim()), 250); };
let st;
async function search(q){
  const box = $('res');
  if (!q){ box.hidden = true; return; }
  const local = places.filter(p => p.name.includes(q)).slice(0, 10);
  const { data, error } = await db.from('biz_master').select('*').ilike('name', '%' + q.replace(/[%_]/g, '') + '%').limit(20);
  const reg = new Set(places.map(p => p.biz_id));
  const rows = (data || []).filter(b => !reg.has(b.id));
  biz = Object.fromEntries(rows.map(b => [b.id, b]));
  let h = local.map(p => '<button class="row" data-a="place" data-id="' + esc(p.id) + '"><b>' + esc(p.name) + '</b><small>' + esc(p.address) + '</small><i>' + won(p.price) + '원</i></button>').join('');
  h += rows.map(b => '<button class="row" data-a="pick" data-id="' + esc(b.id) + '"><b>' + esc(b.name) + (b.branch ? ' ' + esc(b.branch) : '') + '</b><small>' + esc(b.road_addr || b.lot_addr) + ' · 등록 가능</small></button>').join('');
  if (error) h += '<div class="empty">검색 오류: ' + esc(error.message) + '</div>';
  else if (!local.length && !rows.length) h += '<div class="empty">“' + esc(q) + '” 검색 결과가 없어요</div>';
  h += '<button class="row ask" data-a="ask" data-q="' + esc(q) + '">찾는 가게가 없나요? 등록 요청하기</button>';
  box.innerHTML = h; box.hidden = false;
}

async function openPlace(p){
  cur = p; const rt = rate[p.id], addr = p.address || '';
  let fav = null; if (me) fav = (await db.from('favorites').select('place_id').eq('place_id', p.id).maybeSingle()).data;
  const rv = (await db.from('reviews').select('rating,comment,user_id,profiles(username)').eq('place_id', p.id).order('created_at', { ascending: false }).limit(10)).data || [];
  sheet('<h2>' + esc(p.name) + '</h2><p class="sub">' + esc(p.kind) + ' · ' + esc(addr) + '</p>' +
    '<div class="stats"><div><small>금액</small><b>' + won(p.price) + '원</b></div><div><small>평점</small><b>' + (rt ? rt.avg_rating + ' <span>/ 5 (' + rt.n + ')</span>' : '-') + '</b></div></div>' +
    '<div class="btns"><a class="btn" target="_blank" rel="noopener" href="https://map.naver.com/p/search/' + encodeURIComponent(p.name + ' ' + addr) + '">네이버맵에서 보기</a>' +
    '<a class="btn" target="_blank" rel="noopener" href="https://map.kakao.com/link/map/' + encodeURIComponent(p.name) + ',' + p.lat + ',' + p.lng + '">카카오맵에서 보기</a>' +
    '<button class="btn" data-a="fav">' + (fav ? '♥ 즐겨찾기 해제' : '♡ 즐겨찾기') + '</button></div>' +
    '<h3>평가 남기기</h3>' + renderRatingComponent() + '<button class="btn primary" style="margin-top:10px" data-a="review">등록</button>' +
    '<h3>리뷰</h3>' + (rv.length ? rv.map(r => '<div class="rv"><button class="u" data-a="user" data-id="' + esc(r.user_id) + '">@' + esc(r.profiles?.username || '익명') + '</button>' + '★'.repeat(r.rating) + (r.comment ? '<br>' + esc(r.comment) : '') + '</div>').join('') : '<p class="sub">아직 리뷰가 없어요</p>'));
  if (map) map.panTo(new naver.maps.LatLng(p.lat, p.lng));
}

function openNew(b){
  curBiz = b;
  sheet('<h2>' + esc(b.name) + (b.branch ? ' ' + esc(b.branch) : '') + '</h2><p class="sub">' + esc(b.road_addr || b.lot_addr) + '</p>' +
    '<h3>이 가게 등록하기</h3><select id="kd"><option>간짜장</option><option>짜장면</option></select>' +
    '<input id="pr" type="number" step="100" min="0" inputmode="numeric" placeholder="금액 (100원 단위 입력)">' +
    '<div class="price-ctrl">' +
      '<button type="button" class="price-btn" onclick="adjustPrice(1000)">+1,000원</button>' +
      '<button type="button" class="price-btn" onclick="adjustPrice(500)">+500원</button>' +
      '<button type="button" class="price-btn" onclick="adjustPrice(-500)">-500원</button>' +
    '</div>' +
    renderRatingComponent() + '<button class="btn primary" style="margin-top:10px" data-a="saveNew">가게 등록 및 저장</button>');
}

function openAsk(q){
  sheet('<h2>등록 요청</h2><p class="sub">찾는 가게가 없으면 알려주세요. 확인 후 추가할게요.</p><input id="an" value="' + esc(q) + '" placeholder="가게 이름"><input id="aa" placeholder="주소 또는 위치"><input id="ao" placeholder="메모 (선택)"><button class="btn primary" style="margin-top:10px" data-a="sendAsk">요청 보내기</button>');
}
function openLogin(){
  sheet('<h2>로그인</h2><p class="sub">평점, 즐겨찾기, 팔로우를 쓰려면 로그인하세요.</p><div class="btns" style="margin-top:16px"><button class="btn primary" data-a="login" data-p="google">Google로 계속하기</button><button class="btn" data-a="login" data-p="kakao">카카오로 계속하기</button></div>');
}
async function openUser(uid){
  const { data: s } = await db.from('profile_stats').select('*').eq('id', uid).maybeSingle();
  if (!s){ toast('유저를 찾을 수 없어요'); return; }
  let fl = null; if (me && me.id !== uid) fl = (await db.from('follows').select('followee_id').eq('follower_id', me.id).eq('followee_id', uid).maybeSingle()).data;
  sheet('<h2>@' + esc(s.username) + '</h2><div class="stats"><div><small>게시물</small><b>' + s.post_count + '</b></div><div><small>평균 평점</small><b>' + (s.avg_rating ?? '-') + '</b></div></div>' +
    (me && me.id !== uid ? '<button class="btn primary" data-a="follow" data-id="' + esc(uid) + '" data-on="' + (fl ? 1 : 0) + '">' + (fl ? '팔로잉' : '팔로우') + '</button>' : '') +
    (me && me.id === uid ? '<button class="btn" data-a="logout">로그아웃</button>' : ''));
}

const A = {
  close: () => $('sheet').classList.remove('open'),
  me: () => me ? openUser(me.id) : openLogin(),
  place: d => { const p = places.find(x => x.id === d.id); if (p) openPlace(p); },
  pick: d => openNew(biz[d.id]),
  ask: d => openAsk(d.q),
  score: d => {
    scores[d.cat] = +d.n;
    updateStarsUI();
  },
  login: d => db.auth.signInWithOAuth({ provider: d.p, options: { redirectTo: location.origin + location.pathname } }).then(r => r.error && toast('로그인 설정 필요: ' + r.error.message)),
  logout: async () => { await db.auth.signOut(); A.close(); },
  user: d => openUser(d.id),
  fav: async () => {
    if (needLogin()) return;
    const { data } = await db.from('favorites').select('place_id').eq('place_id', cur.id).maybeSingle();
    if (data) await db.from('favorites').delete().eq('place_id', cur.id); else await db.from('favorites').insert({ place_id: cur.id });
    openPlace(cur);
  },
  follow: async d => {
    if (needLogin()) return;
    if (d.on === '1') await db.from('follows').delete().eq('follower_id', me.id).eq('followee_id', d.id);
    else await db.from('follows').insert({ followee_id: d.id });
    openUser(d.id);
  },
  review: async () => {
    if (needLogin()) return;
    const filled = [scores.taste, scores.price, scores.kind, scores.clean].filter(v => v > 0);
    if (filled.length < 4){ toast('4개 평가 항목을 모두 선택해주세요'); return; }
    const finalScore = Math.round((scores.taste + scores.price + scores.kind + scores.clean) / 4);
    const { error } = await db.from('reviews').insert({ place_id: cur.id, rating: finalScore, comment: $('c').value.trim() || null });
    if (error){ toast('등록 실패: ' + error.message); return; }
    await load(); openPlace(cur);
  },
  saveNew: async () => {
    if (needLogin()) return;
    let price = parseInt($('pr').value, 10), b = curBiz;
    if (!(price > 0)){ toast('금액을 입력해주세요'); return; }
    price = Math.round(price / 100) * 100;

    const filled = [scores.taste, scores.price, scores.kind, scores.clean].filter(v => v > 0);
    if (filled.length < 4){ toast('4가지 평가 별점을 모두 선택해주세요'); return; }
    const finalScore = Math.round((scores.taste + scores.price + scores.kind + scores.clean) / 4);

    const { data, error } = await db.from('places').insert({
      biz_id:
