<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MYGJJ</title>
<style>
:root{--bg:#faf6ef;--ink:#1a1412;--sub:#7a6f66;--line:#e4dccf;--gold:#d9a441;--red:#c8382a;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1a1412;--ink:#f4ede2;--sub:#a99e92;--line:#3a312b;--card:#251d19}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
#app{position:relative;height:100%}
#map{position:absolute;inset:0;width:100%;height:100%;background:#e9e5de}
header{position:absolute;z-index:5;left:0;right:0;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.row{display:flex;align-items:baseline;justify-content:space-between}
h1{font:900 20px/1 Georgia,serif;letter-spacing:.08em}
h1 em{color:var(--red);font-style:normal}
#lab{font-size:13px;color:var(--sub)}
#lab b{color:var(--ink)}
input[type=range]{width:100%;margin:10px 0 0;accent-color:var(--red)}
.pin{transform:translate(-50%,-100%);position:relative;background:var(--ink);color:var(--gold);font:700 13px sans-serif;padding:5px 9px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.pin::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.pin.on{background:var(--red);color:#fff}
.pin.on::after{border-top-color:var(--red)}
.fab{position:absolute;z-index:5;border:0;background:var(--ink);color:var(--bg);font:700 14px inherit;padding:11px 16px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer}
#bList{left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
#bLoc{right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
#card{position:absolute;z-index:6;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);background:var(--card);border-left:5px solid var(--red);border-radius:8px;padding:12px 14px;box-shadow:0 3px 12px rgba(0,0,0,.25)}
#card[hidden]{display:none}
#card b{font-size:16px}
#card p{margin-top:4px;color:var(--sub);font-size:14px}
#panel{position:absolute;z-index:8;inset:0;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#panel.open{display:flex}
#ph{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800}
#ph button{border:0;background:none;color:var(--ink);font:700 15px inherit;cursor:pointer}
#list{list-style:none;padding:0 16px;overflow-y:auto}
#list li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
#list small{color:var(--sub)}
#list .pr{grid-row:span 2;align-self:center;font:800 16px Georgia,serif;color:var(--red)}
#notice{position:absolute;z-index:4;inset:100px 16px auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:14px;line-height:1.5}
#notice[hidden]{display:none}
button:focus-visible,input:focus-visible{outline:3px solid #2b6cff;outline-offset:2px}
@media (min-width:760px){#panel{inset:0 auto 0 0;width:380px;border-right:1px solid var(--line)}#card{left:auto;width:340px;right:12px;bottom:80px}}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <header>
    <div class="row"><h1>MY<em>GJJ</em> <small style="font:600 11px sans-serif;color:var(--sub)">v4</small></h1><span id="lab"></span></div>
    <input id="rng" type="range" min="4000" max="12000" step="500" value="8000" aria-label="최대 가격">
  </header>
  <div id="notice" hidden></div>
  <div id="card" hidden></div>
  <button class="fab" id="bList">목록 보기</button>
  <button class="fab" id="bLoc">내 위치</button>
  <section id="panel">
    <div id="ph"><span id="cnt"></span><button id="bClose">닫기</button></div>
    <ul id="list"></ul>
  </section>
</div>
<script>
// ★ 네이버 클라우드 Application의 Client ID를 여기에 넣으세요
const CLIENT_ID = 'd0j0x8a40f';

// Supabase (공개용 키 — 웹페이지에 들어가도 안전한 값)
const SB_URL = 'https://aitolwzpiencyfunjhkp.supabase.co';
const SB_KEY = 'sb_publishable_IdeiksyY68b_r85K69EANg_kW04pydm';
const ADMIN = new URLSearchParams(location.search).has('admin'); // ?admin 이면 지도 탭 시 좌표 표시
let PLACES = [];
async function sb(path){
  const r = await fetch(SB_URL + '/rest/v1/' + path, { headers: { apikey: SB_KEY } });
  if (!r.ok) throw new Error(path + ' → ' + r.status);
  return r.json();
}
async function loadPlaces(){
  try {
    const [pl, rt] = await Promise.all([sb('places?select=*'), sb('place_ratings?select=*')]);
    const m = {}; rt.forEach(x => m[x.place_id] = x);
    PLACES = pl.map(x => ({ id:x.id, n:x.name, t:x.kind, p:x.price, lat:x.lat, lng:x.lng,
      r: m[x.id] ? Number(m[x.id].avg_rating) : null, c: m[x.id] ? Number(m[x.id].n) : 0 }));
  } catch (e) { warn('데이터를 불러오지 못했어요: ' + e.message, true); }
  render();
}
const rtxt = x => x.r == null ? '아직 평가 없음' : '평점 ' + x.r.toFixed(1) + ' (' + x.c + '명)';
let max = 8000, map = null, markers = [], sel = null;
const $ = id => document.getElementById(id);
const won = v => v.toLocaleString('ko-KR');
const shown = () => PLACES.filter(x => x.p <= max).sort((a,b) => a.p - b.p);

function card(x){
  const c = $('card');
  if (!x){ c.hidden = true; return; }
  c.innerHTML = '';
  const b = document.createElement('b'); b.textContent = x.n;
  const p = document.createElement('p'); p.textContent = x.t + ' · ' + won(x.p) + '원 · ' + rtxt(x);
  c.append(b, p); c.hidden = false;
}

function render(){
  const items = shown();
  $('lab').innerHTML = '<b>' + won(max) + '원</b> 이하 · ' + items.length + '곳';
  $('cnt').textContent = items.length + '곳';
  const ul = $('list'); ul.innerHTML = '';
  items.forEach(x => {
    const li = document.createElement('li');
    const a = document.createElement('b'); a.textContent = x.n;
    const s = document.createElement('small'); s.textContent = x.t + ' · ' + rtxt(x);
    const pr = document.createElement('span'); pr.className = 'pr'; pr.textContent = won(x.p);
    li.append(a, pr, s);
    li.onclick = () => { $('panel').classList.remove('open'); pick(x); };
    ul.appendChild(li);
  });
  if (!items.length){ const li = document.createElement('li'); li.textContent = '조건에 맞는 가게가 아직 없어요.'; li.style.color = 'var(--sub)'; ul.appendChild(li); }
  if (!map) return;
  markers.forEach(m => m.setMap(null));
  markers = items.map(x => {
    const mk = new naver.maps.Marker({ map, position: new naver.maps.LatLng(x.lat, x.lng),
      icon: { content: '<div class="pin' + (x === sel ? ' on' : '') + '">' + won(x.p) + '</div>', anchor: new naver.maps.Point(0, 0) } });
    naver.maps.Event.addListener(mk, 'click', () => pick(x));
    return mk;
  });
}

function pick(x){
  sel = x; card(x);
  if (map) map.panTo(new naver.maps.LatLng(x.lat, x.lng));
  render();
}

$('rng').oninput = e => { max = +e.target.value; if (sel && sel.p > max){ sel = null; card(null); } render(); };
$('bList').onclick = () => $('panel').classList.add('open');
$('bClose').onclick = () => $('panel').classList.remove('open');
$('bLoc').onclick = () => {
  if (!map || !navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    p => map.setCenter(new naver.maps.LatLng(p.coords.latitude, p.coords.longitude)),
    () => alert('위치 권한을 허용해주세요.'));
};

function initMap(){
  try {
    map = new naver.maps.Map('map', { center: new naver.maps.LatLng(37.5640, 126.9790), zoom: 15 });
    naver.maps.Event.addListener(map, 'click', e => {
      sel = null;
      if (ADMIN) { const c = $('card'); c.textContent = '좌표  ' + e.coord.lat().toFixed(6) + ', ' + e.coord.lng().toFixed(6); c.hidden = false; }
      else card(null);
      render();
    });
    render();
  } catch (e) { warn('지도 오류: ' + e.message); }
}
window.addEventListener('error', e => warn('오류: ' + e.message));
function warn(t, plain){
  const n = $('notice'); n.textContent = '';
  const b = document.createElement('b'); b.textContent = t;
  const d = document.createElement('div');
  d.textContent = plain ? '' : '이 페이지 주소: ' + location.origin + ' — 네이버 Application의 Web 서비스 URL에 이 주소가 그대로 등록돼 있어야 해요.';
  n.append(b, d); n.hidden = false;
}
window.navermap_authFailure = () => warn('지도 인증에 실패했어요');

render(); loadPlaces();
if (!CLIENT_ID){ warn('지도 키(CLIENT_ID)가 비어 있어요'); }
else {
  const s = document.createElement('script');
  s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(CLIENT_ID);
  s.onload = initMap;
  s.onerror = () => warn('지도 스크립트를 불러오지 못했어요');
  setTimeout(() => { if (!map) warn('지도를 불러오지 못했어요'); }, 6000);
  document.head.appendChild(s);
}
</script>
</body>
</html>
